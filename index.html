<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.30</title>

<style>

body{
font-family:Arial;
margin:0;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:20px;
}

header{
text-align:center;
margin-bottom:20px;
}

.tabs{
text-align:center;
margin-bottom:20px;
}

.tabBtn{
padding:10px 14px;
margin:4px;
border:none;
border-radius:8px;
background:#4caf50;
color:white;
cursor:pointer;
}

.tabBtn:hover{
background:#66bb6a;
}

.container{
display:none;
max-width:900px;
margin:auto;
background:#2b2f36;
padding:20px;
border-radius:12px;
}

.active{
display:block;
}

input,select{
padding:8px;
margin:5px;
border-radius:6px;
border:none;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:10px;
font-size:18px;
}

ul{
list-style:none;
padding:0;
}

/* Crop Planner */

.timeline{
display:grid;
grid-template-columns:repeat(12,1fr);
margin-top:10px;
}

.month{
text-align:center;
font-size:12px;
}

.bar{
height:20px;
border-radius:5px;
margin:2px;
}

.sow{
background:#3498db;
}

.harvest{
background:#f39c12;
}

.nextCrop button{
margin:4px;
background:#4caf50;
color:white;
}

.language{
position:fixed;
bottom:10px;
right:10px;
}

</style>
</head>

<body>

<div class="overlay">

<header>
<h1 id="title">LS25 Helper</h1>
</header>

<div class="tabs">

<button class="tabBtn" onclick="openTab('profit')">Profit</button>
<button class="tabBtn" onclick="openTab('best')">Best Crop</button>
<button class="tabBtn" onclick="openTab('work')">Worktime</button>
<button class="tabBtn" onclick="openTab('bale')">Bales</button>
<button class="tabBtn" onclick="openTab('animals')">Animals</button>
<button class="tabBtn" onclick="openTab('production')">Production</button>
<button class="tabBtn" onclick="openTab('todo')">To-Do</button>
<button class="tabBtn" onclick="openTab('planner')">Crop Planner</button>

</div>

<!-- PROFIT -->

<div id="profit" class="container active">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">
<input id="yieldha" type="number" placeholder="Yield per ha (L)">
<input id="price" type="number" placeholder="Price per 1000L">

<select id="fert">
<option value="1">0%</option>
<option value="1.25">50%</option>
<option value="1.5">100%</option>
</select>

<button onclick="calculate()" id="calcBtn">Calculate</button>

<div class="result" id="result"></div>

</div>

<!-- BEST CROP -->

<div id="best" class="container">

<h2>Best Crop Calculator</h2>

<input id="bestFieldSize" placeholder="Field Size (ha)">

<button onclick="bestCrop()">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<!-- WORKTIME -->

<div id="work" class="container">

<h2>Worktime Calculator</h2>

<input id="width" placeholder="Working Width (m)">
<input id="speed" placeholder="Speed (km/h)">
<input id="workField" placeholder="Field Size (ha)">

<button onclick="calcWork()">Calculate</button>

<div class="result" id="workResult"></div>

</div>

<!-- BALES -->

<div id="bale" class="container">

<h2>Bale Calculator</h2>

<input id="baleSize" placeholder="Bale Size">
<input id="baleCount" placeholder="Number of Bales">

<button onclick="calcBales()">Calculate</button>

<div class="result" id="baleResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="container">

<h2>Animal Feed Calculator</h2>

<input id="animalsCount" placeholder="Animals">
<input id="foodPerDay" placeholder="Food per day">

<button onclick="calcAnimals()">Calculate</button>

<div class="result" id="animalResult"></div>

</div>

<!-- PRODUCTION -->

<div id="production" class="container">

<h2>Production Profit</h2>

<input id="prodInput" placeholder="Input Cost">
<input id="prodOutput" placeholder="Output Value">

<button onclick="calcProduction()">Calculate</button>

<div class="result" id="prodResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="container">

<h2>Farm To-Do</h2>

<input id="todoInput" placeholder="New Task">
<button onclick="addTodo()">Add</button>

<ul id="todoList"></ul>

</div>

<!-- CROP PLANNER -->

<div id="planner" class="container">

<h2>Crop Planner</h2>

<h3 id="cropName">Wheat</h3>

<div id="timeline"></div>

<h3>Recommended next crop</h3>

<div id="nextCrops" class="nextCrop"></div>

</div>

<div class="language">

<button onclick="setLang('en')">🇬🇧</button>
<button onclick="setLang('de')">🇩🇪</button>

</div>

</div>

<script>

/* TAB SYSTEM */

function openTab(tab){

document.querySelectorAll(".container").forEach(c=>{
c.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

}

/* PROFIT */

function calculate(){

let size=document.getElementById("fieldsize").value
let yieldha=document.getElementById("yieldha").value
let price=document.getElementById("price").value
let fert=document.getElementById("fert").value

let totalYield=size*yieldha*fert
let totalProfit=(totalYield/1000)*price

document.getElementById("result").innerHTML=
"Yield: "+Math.round(totalYield)+" L<br>Profit: €"+Math.round(totalProfit)

}

/* BEST CROP */

function bestCrop(){

let size=document.getElementById("bestFieldSize").value

let crops=[
{name:"Wheat",yield:8900,price:900},
{name:"Barley",yield:9600,price:850},
{name:"Canola",yield:5800,price:1200},
{name:"Soybean",yield:5000,price:1500}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){
bestProfit=profit
best=c.name
}

})

document.getElementById("bestResult").innerHTML=
"Best Crop: "+best+" Profit: "+Math.round(bestProfit)

}

/* WORKTIME */

function calcWork(){

let width=document.getElementById("width").value
let speed=document.getElementById("speed").value
let size=document.getElementById("workField").value

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
"Worktime: "+time.toFixed(2)+" hours"

}

/* BALES */

function calcBales(){

let size=document.getElementById("baleSize").value
let count=document.getElementById("baleCount").value

document.getElementById("baleResult").innerHTML=
"Total: "+(size*count)

}

/* ANIMALS */

function calcAnimals(){

let animals=document.getElementById("animalsCount").value
let food=document.getElementById("foodPerDay").value

document.getElementById("animalResult").innerHTML=
"Food per day: "+animals*food

}

/* PRODUCTION */

function calcProduction(){

let input=document.getElementById("prodInput").value
let output=document.getElementById("prodOutput").value

document.getElementById("prodResult").innerHTML=
"Profit: "+(output-input)

}

/* TODO LIST */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

let list=document.getElementById("todoList")
list.innerHTML=""

todos.forEach((t,i)=>{

let li=document.createElement("li")

li.innerHTML=
'<input type="checkbox" '+(t.done?'checked':'')+
' onchange="toggleTodo('+i+')"> '+t.text

list.appendChild(li)

})

}

function addTodo(){

let text=document.getElementById("todoInput").value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

document.getElementById("todoInput").value=""

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

/* CROP PLANNER */

const cropsPlanner={
wheat:{sow:[8,9],harvest:[6,7],next:["Canola","Soybean","Barley"]}
}

let currentCrop="wheat"

function renderPlanner(){

const crop=cropsPlanner[currentCrop]

let html="<div class='timeline'>"

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]

months.forEach(m=>{
html+=`<div class="month">${m}</div>`
})

html+="</div><div class='timeline'>"

for(let i=0;i<12;i++){

let cls=""

if(crop.sow.includes(i)) cls="bar sow"
if(crop.harvest.includes(i)) cls="bar harvest"

html+=`<div><div class="${cls}"></div></div>`

}

html+="</div>"

document.getElementById("timeline").innerHTML=html

let next=""

crop.next.forEach(n=>{
next+=`<button>${n}</button>`
})

document.getElementById("nextCrops").innerHTML=next

}

renderPlanner()

</script>

</body>
</html>
