<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.61</title>

<style>

body{
margin:0;
font-family:Arial;
background:#1e2329;
color:white;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:250px;
background:#111417;
padding:20px;
}

.sidebar h2{
color:#4caf50;
margin-top:0;
}

.navBtn{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:6px;
background:#2e7d32;
color:white;
cursor:pointer;
text-align:left;
}

.navBtn:hover{
background:#4caf50;
}

.devTitle{
margin-top:15px;
font-size:13px;
opacity:0.7;
}

.content{
flex:1;
padding:25px;
overflow:auto;
}

.section{
display:none;
background:rgba(0,0,0,0.6);
padding:25px;
border-radius:10px;
max-width:900px;
}

.active{
display:block;
}

input,select{
padding:10px;
margin:6px;
border:none;
border-radius:6px;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
}

button:hover{
background:#66bb6a;
}

.result{
margin-top:15px;
font-size:18px;
}

.animalBtn{
font-size:38px;
margin:10px;
cursor:pointer;
}

.todoItem{
margin:5px 0;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>LS25 Helper</h2>

<button class="navBtn" onclick="openSection('profit')">Profit Rechner</button>
<button class="navBtn" onclick="openSection('planner')">Feldplanung</button>
<button class="navBtn" onclick="openSection('work')">Arbeitszeit</button>
<button class="navBtn" onclick="openSection('animals')">Tierfutter</button>
<button class="navBtn" onclick="openSection('todo')">Farm To-Do</button>

<div class="devTitle">──── In Entwicklung ────</div>

<button class="navBtn" onclick="openSection('dev')">Beste Frucht</button>
<button class="navBtn" onclick="openSection('dev')">Ballen Rechner</button>
<button class="navBtn" onclick="openSection('dev')">Farmplanung</button>

</div>

<div class="content">

<!-- PROFIT -->

<div id="profit" class="section active">

<h2>Profit Rechner</h2>

<select id="cropSelect">

<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais (Korn)</option>
<option value="45000">🌿 Mais (Silage)</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🟥 Zuckerrüben</option>
<option value="7000">🌾 Reis</option>
<option value="8500">🌾 Sorghum</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="6000">🫘 Bohnen</option>
<option value="6500">🫛 Erbsen</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="15000">🌲 Pappel</option>
<option value="20000">🌿 Gras</option>
<option value="4000">🌱 Ölrettich</option>

</select>

<br>

<input id="fieldsize" placeholder="Feldgröße (ha)">
<input id="price" placeholder="Preis pro 1000L">

<h3>Fertilizer</h3>

<select id="fert">

<option value="0">Keine</option>
<option value="0.25">1x Dünger</option>
<option value="0.5">2x Dünger</option>

</select>

<h3>Additive</h3>

<label><input type="checkbox" id="mulch"> Mulchen</label><br>
<label><input type="checkbox" id="roll"> Walzen</label><br>
<label><input type="checkbox" id="lime"> Kalk</label><br>
<label><input type="checkbox" id="weed"> Unkraut entfernt</label><br>
<label><input type="checkbox" id="pf"> Precision Farming</label>

<br><br>

<button onclick="calculateProfit()">Berechnen</button>

<div class="result" id="profitResult"></div>

</div>

<!-- FELDPLANUNG -->

<div id="planner" class="section">

<h2>Was kann ich diesen Monat säen?</h2>

<select id="monthSelect" onchange="showCrops()">

<option value="1">Januar</option>
<option value="2">Februar</option>
<option value="3">März</option>
<option value="4">April</option>
<option value="5">Mai</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Dezember</option>

</select>

<div class="result" id="cropResult"></div>

</div>

<!-- WORK -->

<div id="work" class="section">

<h2>Arbeitszeit Rechner</h2>

<input id="width" placeholder="Arbeitsbreite (m)">
<input id="speed" placeholder="Geschwindigkeit km/h">
<input id="workField" placeholder="Feldgröße (ha)">

<button onclick="calcWork()">Berechnen</button>

<div class="result" id="workResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="section">

<h2>Tierfutter Rechner</h2>

<div>

<span class="animalBtn" onclick="selectAnimal(45)">🐄</span>
<span class="animalBtn" onclick="selectAnimal(8)">🐖</span>
<span class="animalBtn" onclick="selectAnimal(5)">🐑</span>
<span class="animalBtn" onclick="selectAnimal(0.1)">🐔</span>
<span class="animalBtn" onclick="selectAnimal(10)">🐎</span>

</div>

<input id="animalCount" placeholder="Anzahl Tiere">

<button onclick="calcAnimal()">Berechnen</button>

<div class="result" id="animalResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="section">

<h2>Farm To-Do</h2>

<input id="todoInput">
<button onclick="addTodo()">Hinzufügen</button>

<div id="todoList"></div>

</div>

<!-- DEV -->

<div id="dev" class="section">

<h2>In Entwicklung</h2>

<ul>

<li>Maschinen Arbeitsplaner</li>
<li>Frucht Profit Vergleich</li>
<li>Produktionsketten Rechner</li>

</ul>

</div>

</div>
</div>

<script>

function openSection(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

function calculateProfit(){

let base=parseFloat(document.getElementById("cropSelect").value)
let size=parseFloat(document.getElementById("fieldsize").value)||0
let price=parseFloat(document.getElementById("price").value)||0

let bonus=parseFloat(document.getElementById("fert").value)

if(document.getElementById("mulch").checked) bonus+=0.025
if(document.getElementById("roll").checked) bonus+=0.025
if(document.getElementById("lime").checked) bonus+=0.15
if(document.getElementById("weed").checked) bonus+=0.1
if(document.getElementById("pf").checked) bonus+=0.05

let yieldTotal=base*(1+bonus)*size
let profit=(yieldTotal/1000)*price

document.getElementById("profitResult").innerHTML=

"Ertrag: "+Math.round(yieldTotal)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

const cropCalendar={

"Weizen":[8,9],
"Gerste":[2,3,8,9],
"Hafer":[2,3],
"Raps":[7,8],
"Mais":[4,5],
"Sojabohnen":[4,5],
"Sonnenblumen":[4,5],
"Kartoffeln":[4,5],
"Zuckerrüben":[3,4]

}

function showCrops(){

let month=parseInt(document.getElementById("monthSelect").value)

let html=""

for(let crop in cropCalendar){

if(cropCalendar[crop].includes(month)) html+=crop+"<br>"

}

document.getElementById("cropResult").innerHTML=html

}

function calcWork(){

let width=parseFloat(document.getElementById("width").value)
let speed=parseFloat(document.getElementById("speed").value)
let size=parseFloat(document.getElementById("workField").value)

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
"Zeit: "+time.toFixed(2)+" Stunden"

}

let animalFood=0

function selectAnimal(food){

animalFood=food

}

function calcAnimal(){

let count=parseFloat(document.getElementById("animalCount").value)

let day=count*animalFood

document.getElementById("animalResult").innerHTML=
"Futter pro Tag: "+day+" L"

}

function addTodo(){

let input=document.getElementById("todoInput")

let div=document.createElement("div")

div.className="todoItem"

div.innerText=input.value

document.getElementById("todoList").appendChild(div)

input.value=""

}

</script>

</body>
</html>
