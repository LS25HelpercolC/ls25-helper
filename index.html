<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
background:#2e7d32;
color:white;
text-align:center;
}

header{
background:#1b5e20;
padding:15px;
}

.container{
background:#1b5e20;
padding:20px;
margin:20px auto;
width:90%;
max-width:500px;
border-radius:10px;
}

input,select,button{
padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:5px;
}

button{
background:#4caf50;
color:white;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:10px;
font-size:18px;
}

ul{
list-style:none;
padding:0;
}

.note{
font-size:12px;
opacity:0.8;
margin-top:10px;
}

</style>
</head>

<body>

<header>

<h1>🚜 LS25 Helper</h1>

<button onclick="setLang('en')">🇬🇧 English</button>
<button onclick="setLang('de')">🇩🇪 Deutsch</button>

</header>

<!-- PROFIT CALCULATOR -->

<div class="container">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">

<select id="crop"></select>

<input id="price" type="number" placeholder="Price per 1000L">

<button onclick="calculateProfit()" id="calcBtn">Calculate Profit</button>

<div class="result" id="result"></div>

</div>

<!-- YIELD CALCULATOR -->

<div class="container">

<h2 id="yieldTitle">Yield Calculator</h2>

<input id="yieldField" type="number" placeholder="Field Size (ha)">

<select id="yieldCrop"></select>

<select id="bonus">
<option value="1">No Bonus</option>
<option value="1.45">Fertilized</option>
<option value="1.95">Fully Optimized</option>
<option value="2.15">Precision Farming</option>
</select>

<button onclick="calculateYield()" id="yieldBtn">Calculate Yield</button>

<div class="result" id="yieldResult"></div>

<p class="note">
⚠️ Vanilla LS25 values. Mod maps may differ.
</p>

</div>

<!-- BEST CROP -->

<div class="container">

<h2 id="bestTitle">Best Crop Calculator</h2>

<input id="bestField" type="number" placeholder="Field Size (ha)">

<input id="bestPrice" type="number" placeholder="Price per 1000L">

<button onclick="bestCrop()" id="bestBtn">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<!-- FIELD PLANNER -->

<div class="container">

<h2 id="plannerTitle">Field Planner</h2>

<input id="fieldname" placeholder="Field Name">

<select id="rotation">

<option>Wheat → Canola → Barley</option>
<option>Corn → Wheat → Soybeans</option>
<option>Potatoes → Wheat → Corn</option>
<option>Sugar Beet → Barley → Canola</option>

</select>

<button onclick="addField()" id="addBtn">Add Field</button>

<ul id="fields"></ul>

</div>

<script>

let lang="en"

const crops={
Wheat:8900,
Barley:9600,
Oat:5700,
Corn:9200,
Soybeans:4500,
Canola:5800,
Sunflower:6200,
Potatoes:41300,
"Sugar Beet":57800,
Carrot:77000,
Parsnip:69500,
Onion:35000
}

function loadCrops(){

let cropSelect=document.getElementById("crop")
let yieldSelect=document.getElementById("yieldCrop")

for(let crop in crops){

let option=document.createElement("option")
option.value=crops[crop]
option.text=crop
cropSelect.appendChild(option)

let option2=option.cloneNode(true)
yieldSelect.appendChild(option2)

}

}

loadCrops()

function calculateProfit(){

let size=document.getElementById("fieldsize").value
let yieldPerHa=document.getElementById("crop").value
let price=document.getElementById("price").value

let totalYield=size*yieldPerHa
let profit=(totalYield/1000)*price

document.getElementById("result").innerHTML=
"Yield: "+Math.round(totalYield)+" L<br>Profit: €"+profit.toFixed(0)

}

function calculateYield(){

let size=document.getElementById("yieldField").value
let yieldPerHa=document.getElementById("yieldCrop").value
let bonus=document.getElementById("bonus").value

let totalYield=size*yieldPerHa*bonus

document.getElementById("yieldResult").innerHTML=
"Yield: "+Math.round(totalYield)+" L"

}

function bestCrop(){

let size=document.getElementById("bestField").value
let price=document.getElementById("bestPrice").value

let best=""
let bestProfit=0

for(let crop in crops){

let profit=(size*crops[crop]/1000)*price

if(profit>bestProfit){

bestProfit=profit
best=crop

}

}

document.getElementById("bestResult").innerHTML=
"Best Crop: "+best+"<br>Profit: €"+bestProfit.toFixed(0)

}

function addField(){

let name=document.getElementById("fieldname").value
let rotation=document.getElementById("rotation").value

let li=document.createElement("li")
li.innerText=name+" – "+rotation

document.getElementById("fields").appendChild(li)

}

</script>

</body>
</html>
