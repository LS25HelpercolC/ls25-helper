<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
background:url('farm.jpg') center/cover no-repeat fixed;
color:white;
}

.app{
display:flex;
height:100vh;
backdrop-filter:blur(6px);
}

.sidebar{
width:220px;
background:#1e2a33;
padding:20px;
}

.sidebar h2{
margin-top:0;
}

.sidebar button{
width:100%;
margin:6px 0;
padding:10px;
background:#2e3d47;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.main{
flex:1;
display:flex;
padding:20px;
gap:20px;
overflow:auto;
}

.card{
background:rgba(0,0,0,0.55);
padding:20px;
border-radius:14px;
flex:1;
}

.rightPanel{
width:260px;
background:rgba(0,0,0,0.55);
padding:20px;
border-radius:14px;
}

h1{
margin-top:0;
}

button.action{
background:#4CAF50;
border:none;
padding:8px 14px;
color:white;
border-radius:6px;
cursor:pointer;
}

.fieldButtons button{
margin:4px;
padding:6px 10px;
border:none;
border-radius:6px;
background:#2e3d47;
color:white;
cursor:pointer;
}

.timeline{
margin-top:20px;
}

.year{
margin:20px 0;
}

.months{
display:flex;
justify-content:space-between;
font-size:12px;
margin-bottom:6px;
}

.bar{
height:16px;
background:#333;
border-radius:10px;
position:relative;
overflow:hidden;
}

.fill{
height:100%;
background:linear-gradient(
90deg,
#2ecc71,
#f1c40f,
#e67e22
);
}

.brach{
background:#777;
}

.currentLine{
position:absolute;
width:2px;
background:white;
height:100%;
opacity:0.8;
}

.cropItem{
display:flex;
justify-content:space-between;
margin:4px 0;
font-size:13px;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>🚜 LS25 Helper</h2>

<button>Profit Rechner</button>
<button>Feldplanung</button>
<button>Arbeitszeit</button>
<button>Tierfutter</button>
<button>Farm To-Do</button>
<button>In Entwicklung</button>

</div>


<div class="main">

<div class="card">

<h1>Feldplanung</h1>

<div>

Feldname
<input id="fieldName">

Größe
<input id="fieldSize">

<button class="action" onclick="addField()">+ Feld</button>

</div>

<div class="fieldButtons" id="fieldButtons"></div>

<hr>

<select id="cropSelect"></select>
<button class="action" onclick="addCrop()">+ Frucht hinzufügen</button>

<div id="cropList"></div>

<div class="timeline" id="timeline"></div>

</div>



<div class="rightPanel">

<h3>🌱 Pflanzkalender</h3>

<div id="calendar"></div>

</div>

</div>

</div>


<script>

const cropData = {

"Weizen":{sow:[9,10],harvest:7},
"Gerste":{sow:[9,10],harvest:6},
"Hafer":{sow:[9,10],harvest:7},
"Raps":{sow:[8],harvest:7},
"Mais (Korn)":{sow:[4,5],harvest:10},
"Mais (Silomais)":{sow:[4,5],harvest:10},
"Sojabohnen":{sow:[4,5],harvest:9},
"Sonnenblumen":{sow:[3,4],harvest:9},
"Kartoffeln":{sow:[4],harvest:9},
"Zuckerrüben":{sow:[3,4],harvest:10},
"Erbsen":{sow:[3,4],harvest:7},
"Karotten":{sow:[4],harvest:7},
"Pastinaken":{sow:[4],harvest:6},
"Trauben":{sow:[4],harvest:10},
"Oliven":{sow:[4],harvest:10},
"Reis":{sow:[4],harvest:10},
"Sorghum":{sow:[4],harvest:10},
"Pappel":{sow:[3,4],harvest:12},
"Ölrettich":{sow:[8,9],harvest:11},
"Gras":{sow:[3,4],harvest:10},

"Brach":{sow:[1],harvest:12}

}

let fields = JSON.parse(localStorage.getItem("fields")) || []
let currentField=null
let crops=[]

const months=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]

function addField(){

let name=document.getElementById("fieldName").value
let size=document.getElementById("fieldSize").value

if(!name)return

fields.push({name,size,crops:[]})

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

function renderFields(){

let box=document.getElementById("fieldButtons")

box.innerHTML=""

fields.forEach((f,i)=>{

let btn=document.createElement("button")

btn.innerText=f.name+" ("+f.size+"ha)"

btn.onclick=()=>selectField(i)

box.appendChild(btn)

})

}

function selectField(i){

currentField=i

crops=fields[i].crops || []

renderCrops()

generateTimeline()

}

function addCrop(){

if(crops.length>=10){
alert("Maximal 10 Einträge pro Feld")
return
}

let crop=document.getElementById("cropSelect").value

crops.push(crop)

fields[currentField].crops=crops

localStorage.setItem("fields",JSON.stringify(fields))

renderCrops()

generateTimeline()

}

function renderCrops(){

let box=document.getElementById("cropList")

box.innerHTML=""

crops.forEach(c=>{

let span=document.createElement("span")

span.innerText=c+" → "

box.appendChild(span)

})

}

function generateTimeline(){

let container=document.getElementById("timeline")

container.innerHTML=""

let currentMonth=new Date().getMonth()

crops.forEach((crop,index)=>{

let data=cropData[crop]

let year=document.createElement("div")
year.className="year"

let monthsRow=document.createElement("div")
monthsRow.className="months"

months.forEach(m=>{

let span=document.createElement("span")
span.innerText=m
monthsRow.appendChild(span)

})

let bar=document.createElement("div")
bar.className="bar"

let fill=document.createElement("div")

if(crop==="Brach"){
fill.className="fill brach"
}else{
fill.className="fill"
}

let start=data.sow[0]-1
let end=data.harvest

fill.style.marginLeft=(start/12*100)+"%"
fill.style.width=((end-start)/12*100)+"%"

let line=document.createElement("div")
line.className="currentLine"
line.style.left=(currentMonth/12*100)+"%"

bar.appendChild(fill)
bar.appendChild(line)

year.appendChild(monthsRow)
year.appendChild(bar)

container.appendChild(year)

})

}

function renderCalendar(){

let box=document.getElementById("calendar")

Object.keys(cropData).forEach(c=>{

let data=cropData[c]

let row=document.createElement("div")
row.className="cropItem"

let sow=data.sow.join(",")

row.innerHTML="<span>"+c+"</span><span>"+sow+" → "+data.harvest+"</span>"

box.appendChild(row)

})

}

function init(){

let select=document.getElementById("cropSelect")

Object.keys(cropData).forEach(c=>{

let option=document.createElement("option")
option.value=c
option.innerText=c

select.appendChild(option)

})

renderFields()

renderCalendar()

}

init()

</script>

</body>
</html>
