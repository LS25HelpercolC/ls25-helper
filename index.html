<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
background:#2c3e50;
color:white;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:220px;
background:#1e2a33;
padding:20px;
}

.sidebar h2{
margin-top:0;
}

.sidebar button{
width:100%;
margin:6px 0;
padding:10px;
background:#2e3d47;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.main{
flex:1;
padding:30px;
overflow:auto;
}

.card{
background:rgba(0,0,0,0.45);
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.hidden{
display:none;
}

input,select{
padding:6px;
margin:4px;
border-radius:4px;
border:none;
}

button.action{
background:#4CAF50;
padding:8px 14px;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.cropItem{
display:flex;
justify-content:space-between;
font-size:13px;
margin:4px 0;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>🚜 LS25 Helper</h2>

<button onclick="showTab('profit')">Profit Rechner</button>
<button onclick="showTab('fields')">Feldplanung</button>
<button onclick="showTab('calendar')">Pflanzenkalender</button>

</div>

<div class="main">


<!-- PROFIT RECHNER -->

<div id="profit" class="card">

<h1>Profit Rechner</h1>

Frucht
<select id="cropProfit"></select>

<br>

Feldgröße (ha)
<input id="fieldSizeProfit" type="number">

<br>

Preis (€ pro 1000l)
<input id="priceProfit" type="number">

<h3>Additive</h3>

<label><input type="checkbox" id="fert1"> Düngen 1x (+25%)</label><br>
<label><input type="checkbox" id="fert2"> Düngen 2x (+50%)</label><br>
<label><input type="checkbox" id="mulch"> Mulchen (+2.5%)</label><br>
<label><input type="checkbox" id="roll"> Walzen (+2.5%)</label><br>
<label><input type="checkbox" id="lime"> Kalk (+15%)</label><br>
<label><input type="checkbox" id="weed"> Unkraut entfernt (+10%)</label><br>
<label><input type="checkbox" id="pf"> Precision Farming (+5%)</label>

<br><br>

<button class="action" onclick="calculateProfit()">Berechnen</button>

<h3 id="result"></h3>

</div>


<!-- FELDPLANUNG -->

<div id="fields" class="card hidden">

<h1>Feldplanung</h1>

Feldname
<input id="fieldName">

Größe (ha)
<input id="fieldSize">

<button class="action" onclick="addField()">Feld speichern</button>

<div id="fieldButtons"></div>

<hr>

<select id="cropSelect"></select>
<button class="action" onclick="addCrop()">Frucht hinzufügen</button>

<div id="cropList"></div>

</div>


<!-- PFLANZENKALENDER -->

<div id="calendar" class="card hidden">

<h1>Pflanzenkalender</h1>

<div id="calendarList"></div>

</div>


</div>
</div>


<script>

const cropData = {

"Weizen":{yield:8000,sow:["Sep","Okt"],harvest:"Jul"},
"Gerste":{yield:7800,sow:["Sep","Okt"],harvest:"Jun"},
"Hafer":{yield:7000,sow:["Sep","Okt"],harvest:"Jul"},
"Raps":{yield:6500,sow:["Aug"],harvest:"Jul"},
"Mais (Korn)":{yield:9000,sow:["Apr","Mai"],harvest:"Okt"},
"Mais (Silomais)":{yield:9000,sow:["Apr","Mai"],harvest:"Okt"},
"Sojabohnen":{yield:4500,sow:["Apr","Mai"],harvest:"Sep"},
"Sonnenblumen":{yield:4800,sow:["Mär","Apr"],harvest:"Sep"},
"Kartoffeln":{yield:40000,sow:["Apr"],harvest:"Sep"},
"Zuckerrüben":{yield:42000,sow:["Mär","Apr"],harvest:"Okt"},
"Erbsen":{yield:4500,sow:["Mär","Apr"],harvest:"Jul"},
"Karotten":{yield:38000,sow:["Apr"],harvest:"Jul"},
"Pastinaken":{yield:35000,sow:["Apr"],harvest:"Jun"},
"Trauben":{yield:12000,sow:["Apr"],harvest:"Okt"},
"Oliven":{yield:10000,sow:["Apr"],harvest:"Okt"},
"Reis":{yield:7000,sow:["Apr"],harvest:"Okt"},
"Sorghum":{yield:7500,sow:["Apr"],harvest:"Okt"},
"Pappel":{yield:12000,sow:["Mär","Apr"],harvest:"Ganzjährig"},
"Ölrettich":{yield:0,sow:["Aug","Sep"],harvest:"Nov"},
"Gras":{yield:15000,sow:["Mär","Apr"],harvest:"Mehrfach"}

}

let fields = JSON.parse(localStorage.getItem("fields")) || []
let currentField = null

function showTab(tab){

document.getElementById("profit").classList.add("hidden")
document.getElementById("fields").classList.add("hidden")
document.getElementById("calendar").classList.add("hidden")

document.getElementById(tab).classList.remove("hidden")

}

function calculateProfit(){

let crop=document.getElementById("cropProfit").value
let size=document.getElementById("fieldSizeProfit").value
let price=document.getElementById("priceProfit").value

let yieldBase=cropData[crop].yield

let bonus=1

if(fert1.checked) bonus+=0.25
if(fert2.checked) bonus+=0.50
if(mulch.checked) bonus+=0.025
if(roll.checked) bonus+=0.025
if(lime.checked) bonus+=0.15
if(weed.checked) bonus+=0.10
if(pf.checked) bonus+=0.05

let liters=yieldBase*size*bonus
let money=(liters/1000)*price

document.getElementById("result").innerText=
"Ertrag: "+Math.round(liters)+" L | Gewinn: "+Math.round(money)+" €"

}

function addField(){

let name=document.getElementById("fieldName").value
let size=document.getElementById("fieldSize").value

if(!name)return

fields.push({name,size,crops:[]})

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

function renderFields(){

let box=document.getElementById("fieldButtons")

box.innerHTML=""

fields.forEach((f,i)=>{

let btn=document.createElement("button")
btn.innerText=f.name+" ("+f.size+"ha)"
btn.onclick=()=>selectField(i)

box.appendChild(btn)

})

}

function selectField(i){

currentField=i

renderCrops()

}

function addCrop(){

if(currentField===null){
alert("Bitte zuerst ein Feld auswählen")
return
}

let crop=document.getElementById("cropSelect").value

fields[currentField].crops.push(crop)

localStorage.setItem("fields",JSON.stringify(fields))

renderCrops()

}

function renderCrops(){

let box=document.getElementById("cropList")

box.innerHTML=""

if(currentField===null)return

fields[currentField].crops.forEach(c=>{

let span=document.createElement("span")
span.innerText=c+" → "

box.appendChild(span)

})

}

function renderCalendar(){

let box=document.getElementById("calendarList")

Object.keys(cropData).forEach(c=>{

let row=document.createElement("div")
row.className="cropItem"

row.innerHTML="<span>"+c+"</span><span>"+cropData[c].sow.join(', ')+" → "+cropData[c].harvest+"</span>"

box.appendChild(row)

})

}

function init(){

let select1=document.getElementById("cropProfit")
let select2=document.getElementById("cropSelect")

Object.keys(cropData).forEach(c=>{

let op1=document.createElement("option")
op1.value=c
op1.innerText=c
select1.appendChild(op1)

let op2=document.createElement("option")
op2.value=c
op2.innerText=c
select2.appendChild(op2)

})

renderFields()
renderCalendar()

}

init()

</script>

</body>
</html>
