<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
color:white;
text-align:center;

background:url("https://images.unsplash.com/photo-1598514982443-7b2b2f70b6a6");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

header{
background:rgba(0,0,0,0.7);
padding:15px;
}

.tabs{
margin-top:10px;
}

.tabBtn{
width:auto;
padding:8px 14px;
margin:3px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
}

.tabBtn:hover{
background:#66bb6a;
}

.container{
display:none;

background:rgba(0,0,0,0.65);
padding:20px;
margin:20px auto;
width:90%;
max-width:600px;
border-radius:12px;
}

.active{
display:block;
}

input,select{
padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:6px;
}

button.calc{
background:#4caf50;
color:white;
font-weight:bold;
cursor:pointer;
padding:10px;
width:90%;
}

.result{
margin-top:10px;
font-size:18px;
}

.conditions{
background:rgba(0,0,0,0.35);
padding:10px;
border-radius:8px;
text-align:left;
margin-top:10px;
}

.conditions label{
display:flex;
align-items:center;
gap:8px;
margin:3px 0;
}

.conditions input{
width:auto;
}

</style>
</head>

<body>

<header>

<h1>🚜 LS25 Helper</h1>

<button class="tabBtn" onclick="setLang('en')">🇬🇧 English</button>
<button class="tabBtn" onclick="setLang('de')">🇩🇪 Deutsch</button>

<div class="tabs">

<button class="tabBtn" onclick="openTab('profit')">Profit</button>
<button class="tabBtn" onclick="openTab('best')">Best Crop</button>
<button class="tabBtn" onclick="openTab('planner')">Planner</button>
<button class="tabBtn" onclick="openTab('work')">Worktime</button>

</div>

</header>

<!-- PROFIT -->

<div id="profit" class="container active">

<h2>Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">

<select id="crop">

<option value="8900">Wheat</option>
<option value="9600">Barley</option>
<option value="5800">Canola</option>
<option value="9200">Corn</option>
<option value="4500">Soybeans</option>

</select>

<input id="price" type="number" placeholder="Price per 1000L">

<div class="conditions">

<h3>Field Conditions</h3>

<label>Fertilizer</label>

<select id="fertilizer">
<option value="1">None</option>
<option value="1.225">1x</option>
<option value="1.45">2x</option>
</select>

<label><input type="checkbox" id="lime"> Lime</label>
<label><input type="checkbox" id="weed"> Weeds removed</label>
<label><input type="checkbox" id="mulch"> Mulch</label>
<label><input type="checkbox" id="roll"> Roll</label>
<label><input type="checkbox" id="pf"> Precision Farming</label>

</div>

<button class="calc" onclick="calculate()">Calculate Profit</button>

<div class="result" id="result"></div>

</div>

<!-- BEST CROP -->

<div id="best" class="container">

<h2>Best Crop</h2>

<input id="bestFieldSize" type="number" placeholder="Field Size (ha)">

<button class="calc" onclick="bestCrop()">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<!-- FIELD PLANNER -->

<div id="planner" class="container">

<h2>Field Planner</h2>

<input id="fieldname" placeholder="Field Name">

<select id="rotation">

<option>Wheat → Canola → Barley</option>
<option>Corn → Wheat → Soybeans</option>

</select>

<button class="calc" onclick="addField()">Add Field</button>

<ul id="fields"></ul>

</div>

<!-- WORKTIME -->

<div id="work" class="container">

<h2>Worktime Calculator</h2>

<input id="width" type="number" placeholder="Working Width (m)">
<input id="speed" type="number" placeholder="Speed (km/h)">
<input id="fieldsizeWork" type="number" placeholder="Field Size (ha)">

<button class="calc" onclick="calcWork()">Calculate Time</button>

<div class="result" id="workResult"></div>

</div>

<script>

function openTab(tab){

document.querySelectorAll(".container").forEach(c=>{
c.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

}

function calculate(){

let size=fieldsize.value
let yieldPerHa=crop.value
let price=document.getElementById("price").value

let modifier=parseFloat(fertilizer.value)

if(weed.checked) modifier*=1.15
if(lime.checked) modifier*=1.15
if(mulch.checked) modifier*=1.025
if(roll.checked) modifier*=1.025
if(pf.checked) modifier*=1.20

let totalYield=size*yieldPerHa*modifier
let totalProfit=(totalYield/1000)*price

result.innerHTML="Yield: "+Math.round(totalYield)+" L<br>Profit: €"+totalProfit.toFixed(0)

}

function bestCrop(){

let size=bestFieldSize.value

let crops=[
{name:"Wheat",yield:8900,price:900},
{name:"Barley",yield:9600,price:850},
{name:"Canola",yield:5800,price:1200},
{name:"Corn",yield:9200,price:800},
{name:"Soybeans",yield:4500,price:1500}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){

bestProfit=profit
best=c.name

}

})

bestResult.innerHTML="Best Crop: "+best+"<br>Profit: €"+bestProfit.toFixed(0)

}

function addField(){

let name=fieldname.value
let rotation=document.getElementById("rotation").value

let li=document.createElement("li")
li.innerText=name+" – "+rotation

fields.appendChild(li)

}

function calcWork(){

let width=document.getElementById("width").value
let speed=document.getElementById("speed").value
let size=document.getElementById("fieldsizeWork").value

let haPerHour=(width*speed)/10
let time=size/haPerHour

workResult.innerHTML="Worktime: "+time.toFixed(2)+" hours"

}

</script>

</body>
</html>
