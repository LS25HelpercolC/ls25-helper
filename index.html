<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
background:#1e1e1e;
color:white;
text-align:center;
}

header{
background:#1b5e20;
padding:15px;
}

.tabs{
margin-top:10px;
}

.tabBtn{
padding:8px 14px;
margin:3px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
}

.tabBtn:hover{
background:#66bb6a;
}

.container{
display:none;
padding:20px;
margin:20px auto;
width:90%;
max-width:650px;
border-radius:12px;
background:#2c2c2c;
}

.active{
display:block;
}

input{
padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:6px;
}

button.calc{
background:#4caf50;
color:white;
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
}

button.calc:hover{
background:#66bb6a;
}

.result{
margin-top:10px;
font-size:18px;
}

.language-switch{
position:fixed;
bottom:10px;
right:10px;
background:#00000080;
padding:6px;
border-radius:8px;
}

.language-switch button{
border:none;
background:none;
font-size:18px;
cursor:pointer;
color:white;
}

</style>
</head>

<body>

<header>

<h1 id="title">🚜 LS25 Helper</h1>

<div class="tabs">

<button class="tabBtn" onclick="openTab('profit')">Profit</button>
<button class="tabBtn" onclick="openTab('best')">Best Crop</button>
<button class="tabBtn" onclick="openTab('work')">Worktime</button>
<button class="tabBtn" onclick="openTab('bale')">Bales</button>
<button class="tabBtn" onclick="openTab('animals')">Animals</button>
<button class="tabBtn" onclick="openTab('production')">Production</button>
<button class="tabBtn" onclick="openTab('todo')">To-Do</button>

</div>

</header>

<!-- PROFIT -->

<div id="profit" class="container active">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" placeholder="Field Size (ha)">
<input id="yieldha" placeholder="Yield per ha (L)">
<input id="price" placeholder="Price per 1000L">

<button class="calc" onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<!-- BEST -->

<div id="best" class="container">

<h2 id="bestTitle">Best Crop</h2>

<input id="bestFieldSize" placeholder="Field Size (ha)">

<button class="calc" onclick="bestCrop()">Find</button>

<div class="result" id="bestResult"></div>

</div>

<!-- WORK -->

<div id="work" class="container">

<h2 id="workTitle">Worktime Calculator</h2>

<input id="width" placeholder="Working Width (m)">
<input id="speed" placeholder="Speed (km/h)">
<input id="workField" placeholder="Field Size (ha)">

<button class="calc" onclick="calcWork()">Calculate</button>

<div class="result" id="workResult"></div>

</div>

<!-- BALES -->

<div id="bale" class="container">

<h2 id="baleTitle">Bale Calculator</h2>

<input id="baleSize" placeholder="Bale Size">
<input id="baleCount" placeholder="Number of Bales">

<button class="calc" onclick="calcBales()">Calculate</button>

<div class="result" id="baleResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="container">

<h2 id="animalTitle">Animal Feed</h2>

<input id="animalsCount" placeholder="Animals">
<input id="foodPerDay" placeholder="Food per day">

<button class="calc" onclick="calcAnimals()">Calculate</button>

<div class="result" id="animalResult"></div>

</div>

<!-- PRODUCTION -->

<div id="production" class="container">

<h2 id="prodTitle">Production Profit</h2>

<input id="prodInput" placeholder="Input Cost">
<input id="prodOutput" placeholder="Output Value">

<button class="calc" onclick="calcProduction()">Calculate</button>

<div class="result" id="prodResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="container">

<h2 id="todoTitle">Farm To-Do</h2>

<input id="todoInput" placeholder="New Task">
<button class="calc" onclick="addTodo()">Add</button>

<ul id="todoList"></ul>

</div>

<div class="language-switch">

<button onclick="setLang('en')">🇬🇧</button>
<button onclick="setLang('de')">🇩🇪</button>

</div>

<script>

/* TAB */

function openTab(tab){

document.querySelectorAll(".container").forEach(c=>{
c.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

}

/* PROFIT */

function calculate(){

let size=document.getElementById("fieldsize").value
let yieldha=document.getElementById("yieldha").value
let price=document.getElementById("price").value

let total=size*yieldha
let profit=(total/1000)*price

document.getElementById("result").innerHTML=
"Yield: "+total+" L<br>Profit: €"+profit

}

/* BEST */

function bestCrop(){

let size=document.getElementById("bestFieldSize").value

let crops=[
{name:"Wheat",yield:8900,price:900},
{name:"Barley",yield:9600,price:850},
{name:"Canola",yield:5800,price:1200}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){

bestProfit=profit
best=c.name

}

})

document.getElementById("bestResult").innerHTML=
best+" Profit: "+bestProfit

}

/* WORKTIME */

function calcWork(){

let width=document.getElementById("width").value
let speed=document.getElementById("speed").value
let size=document.getElementById("workField").value

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
time.toFixed(2)+" hours"

}

/* BALES */

function calcBales(){

let size=document.getElementById("baleSize").value
let count=document.getElementById("baleCount").value

document.getElementById("baleResult").innerHTML=
"Total: "+(size*count)

}

/* ANIMALS */

function calcAnimals(){

let animals=document.getElementById("animalsCount").value
let food=document.getElementById("foodPerDay").value

document.getElementById("animalResult").innerHTML=
animals*food+" food per day"

}

/* PRODUCTION */

function calcProduction(){

let input=document.getElementById("prodInput").value
let output=document.getElementById("prodOutput").value

document.getElementById("prodResult").innerHTML=
"Profit: "+(output-input)

}

/* TODO */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

let list=document.getElementById("todoList")
list.innerHTML=""

todos.forEach((t,i)=>{

let li=document.createElement("li")

li.innerHTML=
'<input type="checkbox" '+(t.done?'checked':'')+
' onchange="toggleTodo('+i+')"> '+t.text

list.appendChild(li)

})

}

function addTodo(){

let text=document.getElementById("todoInput").value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

document.getElementById("todoInput").value=""

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

/* LANGUAGE */

function setLang(lang){

if(lang==="de"){

document.getElementById("title").innerText="🚜 LS25 Helfer"

document.getElementById("profitTitle").innerText="Gewinn Rechner"
document.getElementById("bestTitle").innerText="Beste Frucht"
document.getElementById("workTitle").innerText="Arbeitszeit Rechner"
document.getElementById("baleTitle").innerText="Ballen Rechner"
document.getElementById("animalTitle").innerText="Tier Futter"
document.getElementById("prodTitle").innerText="Produktion Gewinn"
document.getElementById("todoTitle").innerText="Farm Aufgaben"

}

else{

document.getElementById("title").innerText="🚜 LS25 Helper"

document.getElementById("profitTitle").innerText="Profit Calculator"
document.getElementById("bestTitle").innerText="Best Crop"
document.getElementById("workTitle").innerText="Worktime Calculator"
document.getElementById("baleTitle").innerText="Bale Calculator"
document.getElementById("animalTitle").innerText="Animal Feed"
document.getElementById("prodTitle").innerText="Production Profit"
document.getElementById("todoTitle").innerText="Farm To-Do"

}

}

</script>

</body>
</html>
