<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
color:white;
text-align:center;

background:url("https://images.pexels.com/photos/2933243/pexels-photo-2933243.jpeg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

header{
background:rgba(0,0,0,0.7);
padding:15px;
}

.container{
background:rgba(0,0,0,0.65);
padding:20px;
margin:20px auto;
width:90%;
max-width:500px;
border-radius:12px;
}

input,select,button{
padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:6px;
}

button{
background:#4caf50;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#66bb6a;
}

.result{
margin-top:10px;
font-size:18px;
}

.conditions{
text-align:left;
}

.conditions label{
display:block;
margin:5px 0;
}

.note{
font-size:12px;
opacity:0.8;
margin-top:10px;
}

ul{
list-style:none;
padding:0;
}

</style>
</head>

<body>

<header>

<h1>🚜 LS25 Helper</h1>

<button onclick="setLang('en')">🇬🇧 English</button>
<button onclick="setLang('de')">🇩🇪 Deutsch</button>

</header>

<div class="container">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">

<select id="crop">
<option value="8900" id="wheat">Wheat</option>
<option value="9600" id="barley">Barley</option>
<option value="5800" id="canola">Canola</option>
<option value="9200" id="corn">Corn</option>
<option value="4500" id="soybeans">Soybeans</option>
<option value="41300" id="potatoes">Potatoes</option>
<option value="57800" id="sugarbeet">Sugar Beet</option>
</select>

<input id="price" type="number" placeholder="Price per 1000L">

<h3 id="conditionsTitle">Field Conditions</h3>

<div class="conditions">

<label>

<span id="fertLabel">Fertilizer</span>

<select id="fertilizer">

<option value="1" id="fert0">None</option>
<option value="1.225" id="fert1">1x Fertilized</option>
<option value="1.45" id="fert2">2x Fertilized</option>

</select>

</label>

<label>
<input type="checkbox" id="weed">
<span id="weedText">Weeds Removed (+15%)</span>
</label>

<label>
<input type="checkbox" id="lime">
<span id="limeText">Limed (+15%)</span>
</label>

<label>
<input type="checkbox" id="mulch">
<span id="mulchText">Mulched (+2.5%)</span>
</label>

<label>
<input type="checkbox" id="roll">
<span id="rollText">Rolled (+2.5%)</span>
</label>

<label>
<input type="checkbox" id="pf">
<span id="pfText">Precision Farming (+20%)</span>
</label>

</div>

<button onclick="calculate()" id="calcBtn">Calculate Profit</button>

<div class="result" id="result"></div>

<p class="note" id="noteText">
⚠️ Based on LS25 vanilla values. Mod maps may differ.
</p>

</div>

<div class="container">

<h2 id="bestCropTitle">Best Crop Calculator</h2>

<input id="bestFieldSize" type="number" placeholder="Field Size (ha)">

<button onclick="bestCrop()" id="bestBtn">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<div class="container">

<h2 id="plannerTitle">Field Planner</h2>

<input id="fieldname" placeholder="Field Name">

<select id="rotation">

<option>Wheat → Canola → Barley</option>
<option>Corn → Wheat → Soybeans</option>
<option>Potatoes → Wheat → Corn</option>
<option>Sugar Beet → Barley → Canola</option>

</select>

<button onclick="addField()" id="addBtn">Add Field</button>

<ul id="fields"></ul>

</div>

<script>

let lang="en"

function setLang(l){

lang=l

if(lang==="de"){

profitTitle.innerText="Gewinn Rechner"
bestCropTitle.innerText="Beste Frucht Rechner"
plannerTitle.innerText="Feldplanung"

conditionsTitle.innerText="Feldbedingungen"

wheat.innerText="Weizen"
barley.innerText="Gerste"
canola.innerText="Raps"
corn.innerText="Mais"
soybeans.innerText="Sojabohnen"
potatoes.innerText="Kartoffeln"
sugarbeet.innerText="Zuckerrüben"

fertLabel.innerText="Düngung"

fert0.innerText="Keine"
fert1.innerText="1x Gedüngt"
fert2.innerText="2x Gedüngt"

weedText.innerText="Unkraut entfernt (+15%)"
limeText.innerText="Gekalkt (+15%)"
mulchText.innerText="Gemulcht (+2.5%)"
rollText.innerText="Gewalzt (+2.5%)"
pfText.innerText="Precision Farming (+20%)"

calcBtn.innerText="Gewinn berechnen"
bestBtn.innerText="Beste Frucht finden"
addBtn.innerText="Feld hinzufügen"

fieldsize.placeholder="Feldgröße (ha)"
price.placeholder="Preis pro 1000L"
fieldname.placeholder="Feld Name"

noteText.innerText="⚠️ Werte basieren auf LS25 Standard Maps. Mod Maps können abweichen."

}

else{

profitTitle.innerText="Profit Calculator"
bestCropTitle.innerText="Best Crop Calculator"
plannerTitle.innerText="Field Planner"

conditionsTitle.innerText="Field Conditions"

wheat.innerText="Wheat"
barley.innerText="Barley"
canola.innerText="Canola"
corn.innerText="Corn"
soybeans.innerText="Soybeans"
potatoes.innerText="Potatoes"
sugarbeet.innerText="Sugar Beet"

fertLabel.innerText="Fertilizer"

fert0.innerText="None"
fert1.innerText="1x Fertilized"
fert2.innerText="2x Fertilized"

weedText.innerText="Weeds Removed (+15%)"
limeText.innerText="Limed (+15%)"
mulchText.innerText="Mulched (+2.5%)"
rollText.innerText="Rolled (+2.5%)"
pfText.innerText="Precision Farming (+20%)"

calcBtn.innerText="Calculate Profit"
bestBtn.innerText="Find Best Crop"
addBtn.innerText="Add Field"

fieldsize.placeholder="Field Size (ha)"
price.placeholder="Price per 1000L"
fieldname.placeholder="Field Name"

noteText.innerText="⚠️ Based on LS25 vanilla values. Mod maps may differ."

}

}

function calculate(){

let size=fieldsize.value
let yieldPerHa=crop.value
let price=document.getElementById("price").value

let modifier=parseFloat(fertilizer.value)

if(weed.checked) modifier*=1.15
if(lime.checked) modifier*=1.15
if(mulch.checked) modifier*=1.025
if(roll.checked) modifier*=1.025
if(pf.checked) modifier*=1.20

let totalYield=size*yieldPerHa*modifier
let totalProfit=(totalYield/1000)*price

result.innerHTML="Yield: "+Math.round(totalYield)+" L<br>Profit: €"+totalProfit.toFixed(0)

}

function bestCrop(){

let size=bestFieldSize.value

let crops=[
{name:"Wheat",yield:8900,price:900},
{name:"Barley",yield:9600,price:850},
{name:"Canola",yield:5800,price:1200},
{name:"Corn",yield:9200,price:800},
{name:"Soybeans",yield:4500,price:1500}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){

bestProfit=profit
best=c.name

}

})

bestResult.innerHTML="Best Crop: "+best+"<br>Profit: €"+bestProfit.toFixed(0)

}

function addField(){

let name=fieldname.value
let rotation=document.getElementById("rotation").value

let li=document.createElement("li")
li.innerText=name+" – "+rotation

fields.appendChild(li)

}

</script>

</body>
</html>
