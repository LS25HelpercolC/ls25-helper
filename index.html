<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.45</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:240px;
background:#1e2329;
padding:15px;
}

.sidebar h2{
margin-top:0;
}

.navBtn{
display:block;
width:100%;
margin:6px 0;
padding:12px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
text-align:left;
font-size:15px;
}

.navBtn:hover{
background:#66bb6a;
}

.devTitle{
margin-top:15px;
font-size:14px;
opacity:0.7;
}

.content{
flex:1;
padding:20px;
overflow:auto;
background-size:cover;
background-position:center;
}

.section{
display:none;
background:rgba(0,0,0,0.55);
padding:20px;
border-radius:10px;
max-width:900px;
}

.active{
display:block;
}

input,select{
padding:8px;
margin:5px;
border:none;
border-radius:6px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:10px;
font-size:18px;
}

.animalBtn{
font-size:32px;
margin:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>LS25 Helper</h2>

<button class="navBtn" onclick="openSection('profit','field')">Profit Rechner</button>
<button class="navBtn" onclick="openSection('planner','map')">Feldplanung</button>
<button class="navBtn" onclick="openSection('work','tractor')">Arbeitszeit</button>
<button class="navBtn" onclick="openSection('animals','animals')">Tierfutter</button>
<button class="navBtn" onclick="openSection('todo','office')">Farm To-Do</button>

<div class="devTitle">──────── In Entwicklung ────────</div>

<button class="navBtn" onclick="openSection('dev')">Beste Frucht</button>
<button class="navBtn" onclick="openSection('dev')">Ballen Rechner</button>
<button class="navBtn" onclick="openSection('dev')">Farmplanung</button>

</div>

<div class="content" id="contentArea">

<!-- PROFIT -->

<div id="profit" class="section active">

<h2>Profit Rechner</h2>

<select id="cropSelect" onchange="setYield()">

<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🌱 Zuckerrüben</option>
<option value="7000">🌾 Reis</option>
<option value="8500">🌾 Sorghum</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="6000">🫘 Bohnen</option>
<option value="6500">🌱 Erbsen</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="15000">🌲 Pappel</option>
<option value="20000">🌿 Gras</option>
<option value="4000">🌱 Ölrettich</option>

</select>

<input id="yieldha" readonly>

<input id="fieldsize" placeholder="Feldgröße (ha)">
<input id="price" placeholder="Preis pro 1000L">

<h3>Düngung</h3>

<select id="fert">

<option value="1">Keine</option>
<option value="1.25">1x Dünger</option>
<option value="1.5">2x Dünger</option>

</select>

<h3>Additive</h3>

<label><input type="checkbox" id="mulch"> Mulchen (+2.5%)</label><br>
<label><input type="checkbox" id="roll"> Walzen (+2.5%)</label><br>
<label><input type="checkbox" id="stones"> Steine entfernt (+2%)</label>

<br><br>

<button onclick="calculateProfit()">Berechnen</button>

<div class="result" id="profitResult"></div>

</div>

<!-- FELDPLANUNG -->

<div id="planner" class="section">

<h2>Feldplanung</h2>

<h3>Was kann ich diesen Monat säen?</h3>

<select id="monthSelect" onchange="showCrops()">

<option value="1">Januar</option>
<option value="2">Februar</option>
<option value="3">März</option>
<option value="4">April</option>
<option value="5">Mai</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Dezember</option>

</select>

<div id="cropResult" style="margin-top:15px;font-size:18px;"></div>

</div>

<!-- WORKTIME -->

<div id="work" class="section">

<h2>Arbeitszeit Rechner</h2>

<input id="width" placeholder="Arbeitsbreite (m)">
<input id="speed" placeholder="Geschwindigkeit (km/h)">
<input id="workField" placeholder="Feldgröße (ha)">

<button onclick="calcWork()">Berechnen</button>

<div class="result" id="workResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="section">

<h2>Tierfutter Rechner</h2>

<div>

<span class="animalBtn" onclick="selectAnimal('Kuh')">🐄</span>
<span class="animalBtn" onclick="selectAnimal('Schwein')">🐖</span>
<span class="animalBtn" onclick="selectAnimal('Schaf')">🐑</span>
<span class="animalBtn" onclick="selectAnimal('Huhn')">🐔</span>
<span class="animalBtn" onclick="selectAnimal('Pferd')">🐎</span>
<span class="animalBtn" onclick="selectAnimal('Ziege')">🐐</span>

</div>

<div id="animalFoodTypes"></div>

<input id="animalCount" placeholder="Anzahl Tiere">

<button onclick="calcAnimalFood()">Berechnen</button>

<div class="result" id="animalResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="section">

<h2>Farm To-Do</h2>

<input id="todoInput" placeholder="Neue Aufgabe">

<button onclick="addTodo()">Hinzufügen</button>

<div id="todoList"></div>

</div>

<!-- DEV -->

<div id="dev" class="section">

<h2>In Entwicklung</h2>

<ul>
<li>Beste Frucht Rechner</li>
<li>Ballen Rechner</li>
<li>Farmplanung</li>
</ul>

</div>

</div>
</div>

<script>

const backgrounds={
field:"https://images.unsplash.com/photo-1560493676-04071c5f467b",
tractor:"https://images.unsplash.com/photo-1592982537447-7440770cbfc9",
animals:"https://images.unsplash.com/photo-1500595046743-cd271d694d30",
office:"https://images.unsplash.com/photo-1519389950473-47ba0277781c",
map:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
}

function openSection(id,bg){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

if(bg){
document.getElementById("contentArea").style.backgroundImage="url("+backgrounds[bg]+")"
}

}

window.onload=function(){
openSection('profit','field')
showCrops()
}

/* PROFIT */

function setYield(){
let crop=document.getElementById("cropSelect").value
document.getElementById("yieldha").value=crop
}
setYield()

function calculateProfit(){

let size=parseFloat(document.getElementById("fieldsize").value)
let yieldha=parseFloat(document.getElementById("yieldha").value)
let price=parseFloat(document.getElementById("price").value)
let fert=parseFloat(document.getElementById("fert").value)

let bonus=1

if(document.getElementById("mulch").checked) bonus+=0.025
if(document.getElementById("roll").checked) bonus+=0.025
if(document.getElementById("stones").checked) bonus+=0.02

let yieldTotal=size*yieldha*fert*bonus
let profit=(yieldTotal/1000)*price

document.getElementById("profitResult").innerHTML=
"Ertrag: "+Math.round(yieldTotal)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

/* CROP CALENDAR */

const cropCalendar={

"🌾 Weizen":[8,9],
"🌾 Gerste":[2,3,8,9],
"🌾 Hafer":[2,3],
"🌱 Raps":[7,8],
"🌽 Mais":[4,5],
"🫘 Sojabohnen":[4,5],
"🌻 Sonnenblumen":[4,5],
"🥔 Kartoffeln":[4,5],
"🌱 Zuckerrüben":[3,4],
"🌾 Sorghum":[4,5],
"🥕 Karotten":[3,4],
"🌱 Erbsen":[3,4]

}

function showCrops(){

let month=parseInt(document.getElementById("monthSelect").value)

let html=""

for(let crop in cropCalendar){

if(cropCalendar[crop].includes(month)){
html+=crop+"<br>"
}

}

document.getElementById("cropResult").innerHTML=html

}

/* WORKTIME */

function calcWork(){

let width=parseFloat(document.getElementById("width").value)
let speed=parseFloat(document.getElementById("speed").value)
let size=parseFloat(document.getElementById("workField").value)

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
"Leistung: "+haHour.toFixed(2)+" ha/h<br>Zeit: "+time.toFixed(2)+" Stunden"

}

/* ANIMALS */

const animalFoodTypes={

"Kuh":{TMR:45,Heu:30,Silage:35,Gras:25},
"Schwein":{Mais:8,Gerste:8,Weizen:8,Soja:8},
"Schaf":{Gras:5,Heu:5},
"Pferd":{Hafer:10,Heu:8},
"Huhn":{Weizen:0.1},
"Ziege":{Gras:6,Heu:6}

}

let selectedFood=0

function selectAnimal(name){

let foods=animalFoodTypes[name]

let html="<h3>"+name+"</h3>"

for(let f in foods){

html+=`<div onclick="selectFood(${foods[f]})">${f} (${foods[f]} L)</div>`

}

document.getElementById("animalFoodTypes").innerHTML=html

}

function selectFood(value){
selectedFood=value
}

function calcAnimalFood(){

let count=parseFloat(document.getElementById("animalCount").value)

let day=count*selectedFood
let month=day*30
let year=day*365

document.getElementById("animalResult").innerHTML=
"Tag: "+day+" L<br>Monat: "+month+" L<br>Jahr: "+year+" L"

}

/* TODO */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

let html=""

todos.forEach((t,i)=>{

html+=`
<div>
<input type="checkbox" ${t.done?'checked':''}
onchange="toggleTodo(${i})"> ${t.text}
</div>
`

})

document.getElementById("todoList").innerHTML=html

}

function addTodo(){

let text=document.getElementById("todoInput").value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

document.getElementById("todoInput").value=""

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

</script>

</body>
</html>
