<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.40</title>

<style>

body{
font-family:Arial;
margin:0;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
color:white;
}

.app{
display:flex;
height:100vh;
background:rgba(0,0,0,0.75);
}

.sidebar{
width:220px;
background:#1b1f24;
padding:15px;
}

.sidebar h2{
margin-top:0;
}

.navBtn{
display:block;
width:100%;
margin:6px 0;
padding:10px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
text-align:left;
}

.navBtn:hover{
background:#66bb6a;
}

.content{
flex:1;
padding:20px;
overflow:auto;
}

.section{
display:none;
background:#2b2f36;
padding:20px;
border-radius:10px;
max-width:900px;
}

.active{
display:block;
}

input,select{
padding:8px;
margin:5px;
border:none;
border-radius:6px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:10px;
font-size:18px;
}

/* Timeline */

.timeline{
display:grid;
grid-template-columns:repeat(12,1fr);
margin-top:10px;
}

.month{
text-align:center;
font-size:12px;
}

.bar{
height:18px;
border-radius:4px;
margin:2px;
}

.sow{
background:#3498db;
}

.harvest{
background:#f39c12;
}

/* Crop Buttons */

.cropButtons button{
margin:4px;
background:#4caf50;
color:white;
}

/* Farm list */

.fieldCard{
background:#3a4048;
padding:10px;
margin:6px 0;
border-radius:8px;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>LS25 Helper</h2>

<button class="navBtn" onclick="openSection('profit')">Profit Rechner</button>
<button class="navBtn" onclick="openSection('best')">Beste Frucht</button>
<button class="navBtn" onclick="openSection('work')">Arbeitszeit</button>
<button class="navBtn" onclick="openSection('bales')">Ballen Rechner</button>
<button class="navBtn" onclick="openSection('animals')">Tier Futter</button>
<button class="navBtn" onclick="openSection('production')">Produktionen</button>
<button class="navBtn" onclick="openSection('todo')">Farm To-Do</button>
<button class="navBtn" onclick="openSection('planner')">Crop Planner</button>
<button class="navBtn" onclick="openSection('farm')">Farm Planner</button>

</div>

<div class="content">

<!-- PROFIT -->

<div id="profit" class="section active">

<h2>Profit Rechner</h2>

<input id="fieldsize" placeholder="Feldgröße (ha)">
<input id="yieldha" placeholder="Ertrag pro ha (L)">
<input id="price" placeholder="Preis pro 1000L">

<select id="fert">
<option value="1">Keine Düngung</option>
<option value="1.25">1x Dünger</option>
<option value="1.5">2x Dünger</option>
</select>

<button onclick="calculateProfit()">Berechnen</button>

<div class="result" id="profitResult"></div>

</div>

<!-- BEST CROP -->

<div id="best" class="section">

<h2>Beste Frucht Rechner</h2>

<input id="bestFieldSize" placeholder="Feldgröße (ha)">

<button onclick="bestCrop()">Berechnen</button>

<div class="result" id="bestResult"></div>

</div>

<!-- WORKTIME -->

<div id="work" class="section">

<h2>Arbeitszeit Rechner</h2>

<input id="width" placeholder="Arbeitsbreite (m)">
<input id="speed" placeholder="Geschwindigkeit (km/h)">
<input id="workField" placeholder="Feldgröße (ha)">

<button onclick="calcWork()">Berechnen</button>

<div class="result" id="workResult"></div>

</div>

<!-- BALES -->

<div id="bales" class="section">

<h2>Ballen Rechner</h2>

<input id="baleSize" placeholder="Ballengröße">
<input id="baleCount" placeholder="Anzahl">

<button onclick="calcBales()">Berechnen</button>

<div class="result" id="baleResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="section">

<h2>Tier Futter Rechner</h2>

<input id="animalsCount" placeholder="Tiere">
<input id="foodPerDay" placeholder="Futter pro Tag">

<button onclick="calcAnimals()">Berechnen</button>

<div class="result" id="animalResult"></div>

</div>

<!-- PRODUCTION -->

<div id="production" class="section">

<h2>Produktions Gewinn</h2>

<input id="prodInput" placeholder="Input Kosten">
<input id="prodOutput" placeholder="Output Wert">

<button onclick="calcProduction()">Berechnen</button>

<div class="result" id="prodResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="section">

<h2>Farm To-Do</h2>

<input id="todoInput" placeholder="Neue Aufgabe">

<button onclick="addTodo()">Hinzufügen</button>

<ul id="todoList"></ul>

</div>

<!-- CROP PLANNER -->

<div id="planner" class="section">

<h2>Crop Planner</h2>

<div class="cropButtons">

<button onclick="showCrop('wheat')">🌾 Weizen</button>
<button onclick="showCrop('barley')">🌾 Gerste</button>
<button onclick="showCrop('canola')">🌱 Raps</button>
<button onclick="showCrop('corn')">🌽 Mais</button>
<button onclick="showCrop('soybean')">🫘 Sojabohnen</button>
<button onclick="showCrop('sunflower')">🌻 Sonnenblume</button>

</div>

<div id="timeline"></div>

<h3>Was kann ich jetzt säen?</h3>

<select id="monthSelect" onchange="showPlantOptions()">
<option value="0">Jan</option>
<option value="1">Feb</option>
<option value="2">Mär</option>
<option value="3">Apr</option>
<option value="4">Mai</option>
<option value="5">Jun</option>
<option value="6">Jul</option>
<option value="7">Aug</option>
<option value="8">Sep</option>
<option value="9">Okt</option>
<option value="10">Nov</option>
<option value="11">Dez</option>
</select>

<div id="plantOptions"></div>

</div>

<!-- FARM PLANNER -->

<div id="farm" class="section">

<h2>Farm Planung</h2>

<input id="fieldName" placeholder="Feldname">
<select id="fieldCrop">
<option value="wheat">Weizen</option>
<option value="barley">Gerste</option>
<option value="canola">Raps</option>
<option value="corn">Mais</option>
<option value="soybean">Sojabohnen</option>
</select>

<input id="fieldSizeInput" placeholder="Größe (ha)">

<select id="fieldFert">
<option value="1">Keine</option>
<option value="1.25">1x Dünger</option>
<option value="1.5">2x Dünger</option>
</select>

<button onclick="addField()">Feld speichern</button>

<div id="farmList"></div>

</div>

</div>
</div>

<script>

/* Navigation */

function openSection(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

/* Profit */

function calculateProfit(){

let size=document.getElementById("fieldsize").value
let yieldha=document.getElementById("yieldha").value
let price=document.getElementById("price").value
let fert=document.getElementById("fert").value

let yieldTotal=size*yieldha*fert
let profit=(yieldTotal/1000)*price

document.getElementById("profitResult").innerHTML=
"Ertrag: "+Math.round(yieldTotal)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

/* Best Crop */

function bestCrop(){

let size=document.getElementById("bestFieldSize").value

let crops=[
{name:"Weizen",yield:8900,price:900},
{name:"Gerste",yield:9600,price:850},
{name:"Raps",yield:5800,price:1200},
{name:"Sojabohnen",yield:5000,price:1500}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){
bestProfit=profit
best=c.name
}

})

document.getElementById("bestResult").innerHTML=
"Beste Frucht: "+best+" Gewinn: "+Math.round(bestProfit)

}

/* Worktime */

function calcWork(){

let width=document.getElementById("width").value
let speed=document.getElementById("speed").value
let size=document.getElementById("workField").value

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
"Arbeitszeit: "+time.toFixed(2)+" Stunden"

}

/* Bales */

function calcBales(){

let size=document.getElementById("baleSize").value
let count=document.getElementById("baleCount").value

document.getElementById("baleResult").innerHTML=
"Total: "+size*count

}

/* Animals */

function calcAnimals(){

let animals=document.getElementById("animalsCount").value
let food=document.getElementById("foodPerDay").value

document.getElementById("animalResult").innerHTML=
"Tagesbedarf: "+animals*food

}

/* Production */

function calcProduction(){

let input=document.getElementById("prodInput").value
let output=document.getElementById("prodOutput").value

document.getElementById("prodResult").innerHTML=
"Gewinn: "+(output-input)

}

/* TODO */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

let list=document.getElementById("todoList")
list.innerHTML=""

todos.forEach((t,i)=>{

let li=document.createElement("li")

li.innerHTML=
'<input type="checkbox" '+(t.done?'checked':'')+
' onchange="toggleTodo('+i+')"> '+t.text

list.appendChild(li)

})

}

function addTodo(){

let text=document.getElementById("todoInput").value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

/* Farm Planner */

function addField(){

let name=document.getElementById("fieldName").value
let crop=document.getElementById("fieldCrop").value
let size=document.getElementById("fieldSizeInput").value
let fert=document.getElementById("fieldFert").value

let fields=JSON.parse(localStorage.getItem("fields"))||[]

fields.push({name,crop,size,fert})

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

function renderFields(){

let fields=JSON.parse(localStorage.getItem("fields"))||[]

let html=""

fields.forEach((f,i)=>{

html+=`
<div class="fieldCard">
<b>${f.name}</b><br>
Frucht: ${f.crop}<br>
Größe: ${f.size} ha
<button onclick="deleteField(${i})">Löschen</button>
</div>
`

})

document.getElementById("farmList").innerHTML=html

}

function deleteField(i){

let fields=JSON.parse(localStorage.getItem("fields"))

fields.splice(i,1)

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

renderFields()

</script>

</body>
</html>
