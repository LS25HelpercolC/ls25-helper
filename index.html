<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.30</title>

<style>

body{
font-family:Arial;
margin:0;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.7);
min-height:100vh;
padding:20px;
}

header{
text-align:center;
margin-bottom:20px;
}

.tabs{
text-align:center;
margin-bottom:20px;
}

.tabBtn{
padding:10px 16px;
margin:5px;
border:none;
border-radius:8px;
background:#4caf50;
color:white;
cursor:pointer;
}

.tabBtn:hover{
background:#66bb6a;
}

.container{
display:none;
max-width:900px;
margin:auto;
background:#2b2f36;
padding:20px;
border-radius:12px;
}

.active{
display:block;
}

.timeline{
display:grid;
grid-template-columns:repeat(12,1fr);
margin-top:10px;
}

.month{
text-align:center;
font-size:12px;
}

.bar{
height:20px;
border-radius:6px;
margin:2px;
}

.sow{
background:#3498db;
}

.grow{
background:#2ecc71;
}

.harvest{
background:#f39c12;
}

.cropCard{
margin-top:20px;
padding:20px;
background:#3a4048;
border-radius:10px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.nextCrop button{
margin:4px;
background:#4caf50;
color:white;
}

.lang{
position:fixed;
bottom:10px;
right:10px;
}

</style>

</head>

<body>

<div class="overlay">

<header>

<h1 id="title"></h1>

</header>

<div class="tabs">

<button class="tabBtn" onclick="openTab('calendar')" id="tabCalendar"></button>
<button class="tabBtn" onclick="openTab('profit')" id="tabProfit"></button>

</div>

<div id="calendar" class="container active">

<h2 id="calendarTitle"></h2>

<div class="cropCard">

<h3 id="cropName"></h3>

<div id="timeline"></div>

<h3 id="nextTitle"></h3>

<div id="nextCrops" class="nextCrop"></div>

</div>

</div>

<div id="profit" class="container">

<h2 id="profitTitle"></h2>

<label id="fieldLabel"></label>
<input id="fieldSize" type="number" value="2">

<br><br>

<label id="fertLabel"></label>

<select id="fert">
<option value="1">0%</option>
<option value="1.25">50%</option>
<option value="1.5">100%</option>
</select>

<br><br>

<button onclick="calculate()" id="calcBtn"></button>

<p id="yield"></p>
<p id="profitResult"></p>

</div>

<div class="lang">

<button onclick="setLang('de')">🇩🇪</button>
<button onclick="setLang('en')">🇬🇧</button>

</div>

</div>

<script>

let lang="de"
let currentCrop="wheat"

const translations={

de:{
title:"LS25 Farm Helfer",
calendar:"Frucht Kalender",
profit:"Gewinn Rechner",
calendarTitle:"Frucht Timeline",
profitTitle:"Ertrags Rechner",
field:"Feldgröße (ha)",
fert:"Düngung",
calculate:"Berechnen",
yield:"Ertrag",
profitLabel:"Gewinn",
next:"Empfohlene nächste Frucht",
months:["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]
},

en:{
title:"LS25 Farm Helper",
calendar:"Crop Calendar",
profit:"Profit Calculator",
calendarTitle:"Crop Timeline",
profitTitle:"Yield Calculator",
field:"Field size (ha)",
fert:"Fertilization",
calculate:"Calculate",
yield:"Yield",
profitLabel:"Profit",
next:"Recommended next crop",
months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
}

}

const crops={

wheat:{
name:{de:"Weizen",en:"Wheat"},
yield:0.89,
sow:[8,9],
harvest:[6,7],
next:["canola","soybean","barley"]
},

canola:{
name:{de:"Raps",en:"Canola"},
yield:0.58
},

soybean:{
name:{de:"Sojabohnen",en:"Soybeans"},
yield:0.45
},

barley:{
name:{de:"Gerste",en:"Barley"},
yield:0.88
}

}

function setLang(l){

lang=l
render()

}

function render(){

const t=translations[lang]

document.getElementById("title").innerText=t.title
document.getElementById("tabCalendar").innerText=t.calendar
document.getElementById("tabProfit").innerText=t.profit
document.getElementById("calendarTitle").innerText=t.calendarTitle
document.getElementById("profitTitle").innerText=t.profitTitle

document.getElementById("fieldLabel").innerText=t.field
document.getElementById("fertLabel").innerText=t.fert
document.getElementById("calcBtn").innerText=t.calculate

document.getElementById("cropName").innerText=crops[currentCrop].name[lang]

document.getElementById("nextTitle").innerText=t.next

renderTimeline()
renderNext()

}

function renderTimeline(){

const t=translations[lang]
const crop=crops[currentCrop]

let html="<div class='timeline'>"

for(let i=0;i<12;i++){

html+=`<div class="month">${t.months[i]}</div>`

}

html+="</div>"

html+="<div class='timeline'>"

for(let i=0;i<12;i++){

let cls=""

if(crop.sow && crop.sow.includes(i)) cls="bar sow"
if(crop.harvest && crop.harvest.includes(i)) cls="bar harvest"

html+=`<div><div class="${cls}"></div></div>`

}

html+="</div>"

document.getElementById("timeline").innerHTML=html

}

function renderNext(){

const crop=crops[currentCrop]

let html=""

if(crop.next){

crop.next.forEach(c=>{

html+=`<button onclick="selectCrop('${c}')">${crops[c].name[lang]}</button>`

})

}

document.getElementById("nextCrops").innerHTML=html

}

function selectCrop(c){

currentCrop=c
render()

}

function calculate(){

const size=document.getElementById("fieldSize").value
const fert=document.getElementById("fert").value

const crop=crops[currentCrop]

const baseYield=crop.yield*10000*size
const totalYield=baseYield*fert

const price=1.6

const profit=totalYield*price

document.getElementById("yield").innerText=
translations[lang].yield+": "+Math.round(totalYield)+" L"

document.getElementById("profitResult").innerText=
translations[lang].profitLabel+": "+Math.round(profit)+" €"

}

function openTab(tab){

document.querySelectorAll(".container").forEach(c=>{
c.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

}

render()

</script>

</body>
</html>
