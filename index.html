<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
color:white;
text-align:center;

background-image:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1500382017468-9049fed747ef");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

header{
background:rgba(0,0,0,0.6);
padding:15px;
backdrop-filter:blur(6px);
}

.container{

background:rgba(0,0,0,0.55);
backdrop-filter:blur(6px);

padding:20px;
margin:20px auto;
width:90%;
max-width:500px;

border-radius:12px;

box-shadow:0 8px 25px rgba(0,0,0,0.4);

}

input,select,button{

padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:6px;

}

button{

background:#4caf50;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.2s;

}

button:hover{

background:#66bb6a;
transform:scale(1.03);

}

.result{

margin-top:10px;
font-size:18px;

}

.conditions{

text-align:left;
margin-top:10px;

}

.conditions label{

display:block;
margin:4px 0;

}

.note{

font-size:12px;
opacity:0.8;
margin-top:10px;

}

ul{

list-style:none;
padding:0;

}

</style>
</head>

<body>

<header>

<h1>🚜 LS25 Helper</h1>

<button onclick="setLang('en')">🇬🇧 English</button>
<button onclick="setLang('de')">🇩🇪 Deutsch</button>

</header>

<!-- PROFIT CALCULATOR -->

<div class="container">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">

<select id="crop">

<option value="8900">Wheat</option>
<option value="9600">Barley</option>
<option value="5800">Canola</option>
<option value="9200">Corn</option>
<option value="4500">Soybeans</option>
<option value="41300">Potatoes</option>
<option value="57800">Sugar Beet</option>

</select>

<input id="price" type="number" placeholder="Price per 1000L">

<h3>Field Conditions</h3>

<div class="conditions">

<label>

Fertilizer

<select id="fertilizer">

<option value="1">None</option>
<option value="1.225">1x Fertilized</option>
<option value="1.45">2x Fertilized</option>

</select>

</label>

<label>
<input type="checkbox" id="weed"> Weeds Removed (+15%)
</label>

<label>
<input type="checkbox" id="lime"> Limed (+15%)
</label>

<label>
<input type="checkbox" id="mulch"> Mulched (+2.5%)
</label>

<label>
<input type="checkbox" id="roll"> Rolled (+2.5%)
</label>

<label>
<input type="checkbox" id="pf"> Precision Farming (+20%)
</label>

</div>

<button onclick="calculate()" id="calcBtn">Calculate Profit</button>

<div class="result" id="result"></div>

<p class="note">

⚠️ Values based on LS25 vanilla maps. Mod maps may differ.

</p>

</div>

<!-- BEST CROP -->

<div class="container">

<h2 id="bestCropTitle">Best Crop Calculator</h2>

<input id="bestFieldSize" type="number" placeholder="Field Size (ha)">

<button onclick="bestCrop()" id="bestBtn">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<!-- FIELD PLANNER -->

<div class="container">

<h2 id="plannerTitle">Field Planner</h2>

<input id="fieldname" placeholder="Field Name">

<select id="rotation">

<option>Wheat → Canola → Barley</option>
<option>Corn → Wheat → Soybeans</option>
<option>Potatoes → Wheat → Corn</option>
<option>Sugar Beet → Barley → Canola</option>

</select>

<button onclick="addField()" id="addBtn">Add Field</button>

<ul id="fields"></ul>

</div>

<script>

let lang="en"

function setLang(l){

lang=l

if(lang==="de"){

document.getElementById("profitTitle").innerText="Gewinn Rechner"
document.getElementById("plannerTitle").innerText="Feldplanung"
document.getElementById("bestCropTitle").innerText="Beste Frucht Rechner"

document.getElementById("calcBtn").innerText="Gewinn berechnen"
document.getElementById("bestBtn").innerText="Beste Frucht finden"
document.getElementById("addBtn").innerText="Feld hinzufügen"

document.getElementById("fieldsize").placeholder="Feldgröße (ha)"
document.getElementById("price").placeholder="Preis pro 1000L"
document.getElementById("fieldname").placeholder="Feld Name"

}

else{

document.getElementById("profitTitle").innerText="Profit Calculator"
document.getElementById("plannerTitle").innerText="Field Planner"
document.getElementById("bestCropTitle").innerText="Best Crop Calculator"

document.getElementById("calcBtn").innerText="Calculate Profit"
document.getElementById("bestBtn").innerText="Find Best Crop"
document.getElementById("addBtn").innerText="Add Field"

document.getElementById("fieldsize").placeholder="Field Size (ha)"
document.getElementById("price").placeholder="Price per 1000L"
document.getElementById("fieldname").placeholder="Field Name"

}

}

function calculate(){

let size=document.getElementById("fieldsize").value
let yieldPerHa=document.getElementById("crop").value
let price=document.getElementById("price").value

let modifier=parseFloat(document.getElementById("fertilizer").value)

if(document.getElementById("weed").checked) modifier*=1.15
if(document.getElementById("lime").checked) modifier*=1.15
if(document.getElementById("mulch").checked) modifier*=1.025
if(document.getElementById("roll").checked) modifier*=1.025
if(document.getElementById("pf").checked) modifier*=1.20

let totalYield=size*yieldPerHa*modifier
let totalProfit=(totalYield/1000)*price

document.getElementById("result").innerHTML=
"Yield: "+Math.round(totalYield)+" L<br>Profit: €"+totalProfit.toFixed(0)

}

function bestCrop(){

let size=document.getElementById("bestFieldSize").value

let crops=[

{name:"Wheat",yield:8900,price:900},
{name:"Barley",yield:9600,price:850},
{name:"Canola",yield:5800,price:1200},
{name:"Corn",yield:9200,price:800},
{name:"Soybeans",yield:4500,price:1500}

]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){

bestProfit=profit
best=c.name

}

})

document.getElementById("bestResult").innerHTML=
"Best Crop: "+best+"<br>Profit: €"+bestProfit.toFixed(0)

}

function addField(){

let name=document.getElementById("fieldname").value
let rotation=document.getElementById("rotation").value

let li=document.createElement("li")
li.innerText=name+" – "+rotation

document.getElementById("fields").appendChild(li)

}

</script>

</body>
</html>
