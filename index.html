<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
background:url('farm.jpg') center/cover no-repeat fixed;
color:white;
}

.app{
display:flex;
height:100vh;
backdrop-filter:blur(6px);
}

.sidebar{
width:220px;
background:#1e2a33;
padding:20px;
}

.sidebar h2{
margin-top:0;
}

.sidebar button{
width:100%;
margin:6px 0;
padding:10px;
background:#2e3d47;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.main{
flex:1;
padding:30px;
overflow:auto;
}

.card{
background:rgba(0,0,0,0.55);
padding:25px;
border-radius:14px;
max-width:900px;
margin:auto;
}

h1{
margin-top:0;
}

select,input{
padding:8px;
margin:6px;
border-radius:6px;
border:none;
}

button.action{
background:#4CAF50;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}

.timeline{
margin-top:30px;
}

.year{
margin:20px 0;
}

.months{
display:flex;
justify-content:space-between;
font-size:12px;
margin-bottom:6px;
}

.bar{
height:12px;
border-radius:20px;
background:#555;
position:relative;
overflow:hidden;
}

.fill{
height:100%;
background:linear-gradient(90deg,#2ecc71,#f1c40f,#e67e22);
}

.fieldButtons button{
margin:4px;
padding:6px 12px;
border-radius:6px;
border:none;
cursor:pointer;
}

.cropList{
margin-top:10px;
}

.cropList span{
margin-right:10px;
}

.sowBox{
margin-top:20px;
background:#222;
padding:10px;
border-radius:8px;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">
<h2>🚜 LS25 Helper</h2>

<button>Profit Rechner</button>
<button>Feldplanung</button>
<button>Arbeitszeit</button>
<button>Tierfutter</button>
<button>Farm To-Do</button>
<button>In Entwicklung</button>

</div>

<div class="main">

<div class="card">

<h1>Feldplanung</h1>

<div>
Feldname:
<input id="fieldName">

Größe (ha):
<input id="fieldSize">

<button class="action" onclick="addField()">Feld speichern</button>
</div>

<div class="fieldButtons" id="fieldButtons"></div>

<hr>

<h3>Fruchtfolge</h3>

<select id="cropSelect">
<option>Weizen</option>
<option>Raps</option>
<option>Gerste</option>
<option>Mais</option>
<option>Sojabohnen</option>
<option>Sonnenblumen</option>
</select>

<button class="action" onclick="addCrop()">+ Frucht</button>

<div class="cropList" id="cropList"></div>

<hr>

<h3>Planungsdauer</h3>

<select id="yearsSelect">
<option value="2">2 Jahre</option>
<option value="3" selected>3 Jahre</option>
<option value="4">4 Jahre</option>
<option value="5">5 Jahre</option>
</select>

<button class="action" onclick="generateTimeline()">Timeline erstellen</button>

<div class="timeline" id="timeline"></div>

<div class="sowBox">

<h3>🌱 Was kann ich diesen Monat säen?</h3>

<select id="monthSelect">
<option value="1">Jan</option>
<option value="2">Feb</option>
<option value="3">Mär</option>
<option value="4">Apr</option>
<option value="5">Mai</option>
<option value="6">Jun</option>
<option value="7">Jul</option>
<option value="8">Aug</option>
<option value="9">Sep</option>
<option value="10">Okt</option>
<option value="11">Nov</option>
<option value="12">Dez</option>
</select>

<button onclick="whatToSow()">anzeigen</button>

<div id="sowResult"></div>

</div>

</div>

</div>

</div>

<script>

let fields = JSON.parse(localStorage.getItem("fields")) || []
let currentField = null
let crops = []

function addField(){

let name = document.getElementById("fieldName").value
let size = document.getElementById("fieldSize").value

if(!name)return

fields.push({name,size})

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

function renderFields(){

let box = document.getElementById("fieldButtons")
box.innerHTML=""

fields.forEach((f,i)=>{

let btn=document.createElement("button")
btn.innerText=f.name+" ("+f.size+"ha)"
btn.onclick=()=>selectField(i)

box.appendChild(btn)

})

}

function selectField(i){

currentField=i
crops=[]

document.getElementById("cropList").innerHTML=""

}

function addCrop(){

let crop=document.getElementById("cropSelect").value

crops.push(crop)

renderCrops()

}

function renderCrops(){

let box=document.getElementById("cropList")

box.innerHTML=""

crops.forEach(c=>{

let span=document.createElement("span")
span.innerText=c+" → "

box.appendChild(span)

})

}

function generateTimeline(){

let years=document.getElementById("yearsSelect").value

let container=document.getElementById("timeline")

container.innerHTML=""

for(let y=1;y<=years;y++){

let year=document.createElement("div")
year.className="year"

let months=document.createElement("div")
months.className="months"

let monthNames=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]

monthNames.forEach(m=>{
let span=document.createElement("span")
span.innerText=m
months.appendChild(span)
})

let bar=document.createElement("div")
bar.className="bar"

let fill=document.createElement("div")
fill.className="fill"

fill.style.width=Math.random()*100+"%"

bar.appendChild(fill)

year.appendChild(months)
year.appendChild(bar)

container.appendChild(year)

}

}

function whatToSow(){

let m=document.getElementById("monthSelect").value

let result=[]

if(m>=3 && m<=5) result=["Mais","Sojabohnen","Sonnenblumen"]
if(m>=9 && m<=10) result=["Weizen","Gerste","Raps"]

document.getElementById("sowResult").innerText=result.join(", ")

}

renderFields()

</script>

</body>
</html>
