<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.62</title>

<style>

body{
font-family:Arial;
margin:0;
background:url("https://images.unsplash.com/photo-1592982537447-7440770cbfc9") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.7);
min-height:100vh;
padding:30px;
}

.container{
max-width:650px;
margin:auto;
background:#1e2329;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.6);
}

h1{
text-align:center;
margin-bottom:20px;
}

select,input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
font-size:15px;
}

.row{
display:flex;
gap:10px;
}

.row input{
flex:1;
}

.section{
margin-top:20px;
}

label{
display:flex;
align-items:center;
gap:8px;
margin:6px 0;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:#4CAF50;
border:none;
border-radius:8px;
font-size:16px;
color:white;
cursor:pointer;
}

button:hover{
background:#66bb6a;
}

.result{
margin-top:20px;
font-size:18px;
text-align:center;
}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<h1>🚜 LS25 Feldberechnung</h1>

<!-- Frucht auswählen -->

<select id="crop">

<option value="8900">Weizen</option>
<option value="9600">Gerste</option>
<option value="8800">Hafer</option>
<option value="5800">Raps</option>

<option value="9200">Mais (Korn)</option>
<option value="45000">Mais (Silomais)</option>

<option value="5000">Sojabohnen</option>
<option value="7000">Sonnenblumen</option>

<option value="42000">Kartoffeln</option>
<option value="60000">Zuckerrüben</option>

<option value="6500">Erbsen</option>
<option value="30000">Karotten</option>
<option value="28000">Pastinaken</option>

<option value="12000">Trauben</option>
<option value="10000">Oliven</option>

<option value="7000">Reis</option>
<option value="8500">Sorghum</option>

<option value="15000">Pappel</option>
<option value="4000">Ölrettich</option>
<option value="20000">Gras</option>

</select>

<!-- Feldgröße + Preis -->

<div class="row">

<input id="fieldsize" type="number" placeholder="Feldgröße (ha)">

<input id="price" type="number" placeholder="Preis pro 1000L">

</div>

<!-- Düngung -->

<div class="section">

<h3>Düngestufe</h3>

<label>
<input type="radio" name="fert" value="0">
Keine
</label>

<label>
<input type="radio" name="fert" value="0.25">
1x Düngen (+25%)
</label>

<label>
<input type="radio" name="fert" value="0.5">
2x Düngen (+50%)
</label>

</div>

<!-- Arbeitsschritte -->

<div class="section">

<h3>Arbeitsschritte</h3>

<label>
<input type="checkbox" id="mulch">
Mulchen (+2.5%)
</label>

<label>
<input type="checkbox" id="roll">
Walzen (+2.5%)
</label>

<label>
<input type="checkbox" id="lime">
Kalk (+15%)
</label>

<label>
<input type="checkbox" id="weed">
Unkraut entfernt (+10%)
</label>

<label>
<input type="checkbox" id="pf">
Precision Farming (+5%)
</label>

</div>

<button onclick="calculate()">Berechnen</button>

<div class="result" id="result"></div>

</div>

</div>

<script>

/* ===================================== */
/* PROFIT / FELDBERECHNUNG FINAL */
/* NICHT MEHR ÄNDERN */
/* ===================================== */

function calculate(){

let base=parseFloat(document.getElementById("crop").value)
let size=parseFloat(document.getElementById("fieldsize").value)
let price=parseFloat(document.getElementById("price").value)

if(!size || !price){
alert("Bitte Feldgröße und Preis eingeben")
return
}

let fert=document.querySelector('input[name="fert"]:checked')

let bonus=0

if(fert){
bonus+=parseFloat(fert.value)
}

if(document.getElementById("mulch").checked){
bonus+=0.025
}

if(document.getElementById("roll").checked){
bonus+=0.025
}

if(document.getElementById("lime").checked){
bonus+=0.15
}

if(document.getElementById("weed").checked){
bonus+=0.10
}

if(document.getElementById("pf").checked){
bonus+=0.05
}

let yieldPerHa=base*(1+bonus)

let totalYield=yieldPerHa*size

let profit=(totalYield/1000)*price

document.getElementById("result").innerHTML=

"Ertrag: "+Math.round(totalYield)+" L<br><br>Gewinn: "+Math.round(profit)+" €"

}

</script>

</body>
</html>
