<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.panel{

width:700px;
background:rgba(20,20,20,0.8);
border-radius:15px;
padding:25px;
box-shadow:0 0 30px rgba(0,0,0,0.8);

}

h1{
text-align:center;
margin-bottom:20px;
}

.toprow{
display:flex;
gap:10px;
margin-bottom:15px;
}

select,input{

padding:10px;
border:none;
border-radius:6px;
flex:1;

}

.section{
margin-top:15px;
}

.section h3{
margin-bottom:8px;
}

label{
display:flex;
align-items:center;
gap:6px;
margin:5px 0;
}

button{

margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#4CAF50;
font-size:16px;
color:white;
cursor:pointer;

}

button:hover{
background:#66bb6a;
}

.result{

margin-top:15px;
text-align:center;
font-size:18px;

}

.cropBar{

margin-top:20px;
display:grid;
grid-template-columns:repeat(10,1fr);
gap:6px;

}

.cropBar div{

font-size:22px;
text-align:center;

}

</style>
</head>

<body>

<div class="panel">

<h1>Profit Rechner</h1>

<div class="toprow">

<select id="crop">

<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais (Korn)</option>
<option value="45000">🌽 Mais (Silomais)</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🟥 Zuckerrüben</option>
<option value="6500">🫛 Erbsen</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="7000">🌿 Reis</option>
<option value="8500">🌿 Sorghum</option>
<option value="15000">🌲 Pappel</option>
<option value="4000">🌱 Ölrettich</option>
<option value="20000">🌿 Gras</option>

</select>

</div>

<div class="toprow">

<input id="fieldSize" placeholder="Feldgröße (ha)" type="number">
<input id="price" placeholder="Preis pro 1000L" type="number">

</div>

<div class="section">

<h3>Düngestufe</h3>

<label><input type="radio" name="fert" value="0">Keine</label>
<label><input type="radio" name="fert" value="0.25">1x Düngen (+25%)</label>
<label><input type="radio" name="fert" value="0.5">2x Düngen (+50%)</label>

</div>

<div class="section">

<h3>Arbeitsschritte</h3>

<label><input type="checkbox" id="mulch">Mulchen (+2.5%)</label>
<label><input type="checkbox" id="roll">Walzen (+2.5%)</label>
<label><input type="checkbox" id="lime">Kalk (+15%)</label>
<label><input type="checkbox" id="weed">Unkraut entfernt (+10%)</label>
<label><input type="checkbox" id="pf">Precision Farming (+5%)</label>

</div>

<button onclick="calc()">Berechnen</button>

<div class="result" id="result">

Ertrag: XXXX L<br>
Gewinn: XXXX €

</div>

<div class="cropBar">

<div>🌾</div>
<div>🌾</div>
<div>🌾</div>
<div>🌱</div>
<div>🌽</div>
<div>🌽</div>
<div>🫘</div>
<div>🌻</div>
<div>🥔</div>
<div>🟥</div>

<div>🫛</div>
<div>🥕</div>
<div>🥔</div>
<div>🍇</div>
<div>🫒</div>
<div>🌿</div>
<div>🌿</div>
<div>🌲</div>
<div>🌱</div>
<div>🌿</div>

</div>

</div>

<script>

function calc(){

let base=parseFloat(document.getElementById("crop").value)
let size=parseFloat(document.getElementById("fieldSize").value)
let price=parseFloat(document.getElementById("price").value)

if(!size||!price){
alert("Bitte Feldgröße und Preis eingeben")
return
}

let bonus=0

let fert=document.querySelector('input[name="fert"]:checked')

if(fert) bonus+=parseFloat(fert.value)

if(mulch.checked) bonus+=0.025
if(roll.checked) bonus+=0.025
if(lime.checked) bonus+=0.15
if(weed.checked) bonus+=0.10
if(pf.checked) bonus+=0.05

let yieldHa=base*(1+bonus)

let total=yieldHa*size

let profit=(total/1000)*price

document.getElementById("result").innerHTML=

"Ertrag: "+Math.round(total)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

</script>

</body>
</html>
