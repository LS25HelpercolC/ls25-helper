<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
}

/* dunkles overlay */

.overlay{
background:rgba(0,0,0,0.65);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* panel */

.panel{
width:520px;
background:rgba(30,30,30,0.85);
border-radius:14px;
padding:25px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
}

/* titel */

h1{
text-align:center;
margin-bottom:20px;
}

/* inputs */

select,input{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
border-radius:6px;
border:none;
font-size:14px;
}

.row{
display:flex;
gap:10px;
}

/* section */

.sectionTitle{
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

/* checkboxes */

.checkboxGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:6px;
}

/* button */

button{
width:100%;
padding:12px;
margin-top:18px;
border:none;
border-radius:8px;
background:#4caf50;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#66bb6a;
}

/* result */

.result{
text-align:center;
margin-top:15px;
font-size:18px;
}

/* icon bar */

.icons{
margin-top:20px;
text-align:center;
font-size:26px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="panel">

<h1>🚜 Profit Rechner</h1>

<select id="crop">
<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais (Korn)</option>
<option value="45000">🌽 Silomais</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🟥 Zuckerrüben</option>
<option value="6500">🫛 Erbsen</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="7000">🌿 Reis</option>
<option value="8500">🌿 Sorghum</option>
<option value="15000">🌲 Pappel</option>
<option value="4000">🌱 Ölrettich</option>
<option value="20000">🌿 Gras</option>
</select>

<div class="row">
<input id="size" type="number" placeholder="Feldgröße (ha)">
<input id="price" type="number" placeholder="Preis pro 1000L">
</div>

<div class="sectionTitle">Düngestufe</div>

<label><input type="radio" name="fert" value="1" checked> Keine</label><br>
<label><input type="radio" name="fert" value="1.25"> 1x Düngen (+25%)</label><br>
<label><input type="radio" name="fert" value="1.5"> 2x Düngen (+50%)</label>

<div class="sectionTitle">Arbeitsschritte</div>

<div class="checkboxGrid">

<label><input type="checkbox" id="mulch"> Mulchen (+2.5%)</label>
<label><input type="checkbox" id="roll"> Walzen (+2.5%)</label>
<label><input type="checkbox" id="lime"> Kalk (+15%)</label>
<label><input type="checkbox" id="weed"> Unkraut entfernt (+10%)</label>
<label><input type="checkbox" id="pf"> Precision Farming (+5%)</label>

</div>

<button onclick="calc()">Berechnen</button>

<div class="result" id="result"></div>

<div class="icons">
🌾 🌾 🌾 🌱 🌽 🌽 🫘 🌻 🥔 🟥 🫛 🥕 🥔 🍇 🫒 🌿 🌿 🌲 🌱 🌿
</div>

</div>
</div>

<script>

function calc(){

let yieldHa=document.getElementById("crop").value
let size=document.getElementById("size").value
let price=document.getElementById("price").value

let fert=document.querySelector('input[name="fert"]:checked').value

let bonus=1

if(document.getElementById("mulch").checked) bonus+=0.025
if(document.getElementById("roll").checked) bonus+=0.025
if(document.getElementById("lime").checked) bonus+=0.15
if(document.getElementById("weed").checked) bonus+=0.10
if(document.getElementById("pf").checked) bonus+=0.05

let totalYield=yieldHa*size*fert*bonus

let profit=(totalYield/1000)*price

document.getElementById("result").innerHTML=
"Ertrag: "+Math.round(totalYield)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

</script>

</body>
</html>
