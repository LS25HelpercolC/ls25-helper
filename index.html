<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
font-family:Arial;
margin:0;
color:white;
text-align:center;
background:#1e1e1e;
}

/* HEADER */

header{
background:#1b5e20;
padding:15px;
}

.tabs{
margin-top:10px;
}

.tabBtn{
padding:8px 14px;
margin:3px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
}

.tabBtn:hover{
background:#66bb6a;
}

/* TOOL AREA */

.container{

display:none;

padding:20px;
margin:20px auto;
width:90%;
max-width:750px;
border-radius:12px;

background-size:cover;
background-position:center;

}

.active{
display:block;
}

/* TAB BACKGROUNDS */

#profit{background-image:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef")}
#best{background-image:url("https://images.unsplash.com/photo-1598514982443-7b2b2f70b6a6")}
#work{background-image:url("https://images.unsplash.com/photo-1492496913980-501348b61469")}
#planner{background-image:url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6")}
#bale{background-image:url("https://images.unsplash.com/photo-1464226184884-fa280b87c399")}
#animals{background-image:url("https://images.unsplash.com/photo-1500595046743-cd271d694d30")}
#production{background-image:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef")}
#todo{background-image:url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6")}

.container::before{
content:"";
position:absolute;
left:0;
right:0;
top:0;
bottom:0;
background:rgba(0,0,0,0.55);
border-radius:12px;
}

.container>*{
position:relative;
}

/* INPUTS */

input,select{
padding:10px;
margin:6px;
width:90%;
border:none;
border-radius:6px;
}

button.calc{
background:#4caf50;
color:white;
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
}

button.calc:hover{
background:#66bb6a;
}

.result{
margin-top:10px;
font-size:18px;
}

/* TODO */

#todoList{
text-align:left;
margin-top:10px;
}

/* LANGUAGE */

.language-switch{
position:fixed;
bottom:10px;
right:10px;
background:rgba(0,0,0,0.6);
padding:6px;
border-radius:8px;
}

.language-switch button{
border:none;
background:none;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<h1 id="title">🚜 LS25 Helper</h1>

<div class="tabs">

<button class="tabBtn" onclick="openTab('profit')">Profit</button>
<button class="tabBtn" onclick="openTab('best')">Best Crop</button>
<button class="tabBtn" onclick="openTab('work')">Worktime</button>
<button class="tabBtn" onclick="openTab('planner')">Planner</button>
<button class="tabBtn" onclick="openTab('bale')">Bales</button>
<button class="tabBtn" onclick="openTab('animals')">Animals</button>
<button class="tabBtn" onclick="openTab('production')">Production</button>
<button class="tabBtn" onclick="openTab('todo')">To-Do</button>

</div>

</header>

<!-- PROFIT -->

<div id="profit" class="container active">

<h2 id="profitTitle">Profit Calculator</h2>

<input id="fieldsize" type="number" placeholder="Field Size (ha)">
<input id="yield" type="number" placeholder="Yield per ha (L)">
<input id="price" type="number" placeholder="Price per 1000L">

<button class="calc" onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<!-- BEST CROP -->

<div id="best" class="container">

<h2 id="bestTitle">Best Crop</h2>

<input id="bestFieldSize" type="number" placeholder="Field Size (ha)">

<button class="calc" onclick="bestCrop()">Find Best Crop</button>

<div class="result" id="bestResult"></div>

</div>

<!-- WORKTIME -->

<div id="work" class="container">

<h2 id="workTitle">Worktime Calculator</h2>

<input id="width" placeholder="Working Width (m)">
<input id="speed" placeholder="Speed (km/h)">
<input id="fieldsizeWork" placeholder="Field Size (ha)">

<button class="calc" onclick="calcWork()">Calculate</button>

<div class="result" id="workResult"></div>

</div>

<!-- BALE -->

<div id="bale" class="container">

<h2 id="baleTitle">Bale Calculator</h2>

<input id="baleSize" placeholder="Bale Size (L)">
<input id="baleCount" placeholder="Number of Bales">

<button class="calc" onclick="calcBales()">Calculate</button>

<div class="result" id="baleResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="container">

<h2 id="animalTitle">Animal Feed</h2>

<input id="animalsCount" placeholder="Number of Animals">
<input id="foodPerDay" placeholder="Food per Day">

<button class="calc" onclick="calcAnimals()">Calculate</button>

<div class="result" id="animalResult"></div>

</div>

<!-- PRODUCTION -->

<div id="production" class="container">

<h2 id="prodTitle">Production Profit</h2>

<input id="prodInput" placeholder="Input Cost">
<input id="prodOutput" placeholder="Output Value">

<button class="calc" onclick="calcProduction()">Calculate</button>

<div class="result" id="prodResult"></div>

</div>

<!-- TODO -->

<div id="todo" class="container">

<h2 id="todoTitle">Farm To-Do List</h2>

<input id="todoInput" placeholder="New Task">
<button class="calc" onclick="addTodo()">Add</button>

<ul id="todoList"></ul>

</div>

<!-- LANGUAGE -->

<div class="language-switch">

<button onclick="setLang('en')">🇬🇧</button>
<button onclick="setLang('de')">🇩🇪</button>

</div>

<script>

/* TABS */

function openTab(tab){

document.querySelectorAll(".container").forEach(c=>{
c.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

}

/* PROFIT */

function calculate(){

let size=fieldsize.value
let yieldHa=document.getElementById("yield").value
let price=document.getElementById("price").value

let total=size*yieldHa
let profit=(total/1000)*price

result.innerHTML="Yield: "+total+" L<br>Profit: €"+profit.toFixed(0)

}

/* WORKTIME */

function calcWork(){

let width=document.getElementById("width").value
let speed=document.getElementById("speed").value
let size=document.getElementById("fieldsizeWork").value

let haPerHour=(width*speed)/10
let time=size/haPerHour

workResult.innerHTML="Worktime: "+time.toFixed(2)+" hours"

}

/* BALES */

function calcBales(){

let size=baleSize.value
let count=baleCount.value

let total=size*count

baleResult.innerHTML="Total: "+total+" L"

}

/* ANIMALS */

function calcAnimals(){

let animals=animalsCount.value
let food=foodPerDay.value

animalResult.innerHTML="Daily food: "+(animals*food)

}

/* PRODUCTION */

function calcProduction(){

let input=prodInput.value
let output=prodOutput.value

let profit=output-input

prodResult.innerHTML="Profit: "+profit

}

/* TODO */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todoList.innerHTML=""

todos.forEach((t,i)=>{

let li=document.createElement("li")

li.innerHTML=
'<input type="checkbox" '+(t.done?'checked':'')+
' onchange="toggleTodo('+i+')"> '+t.text

todoList.appendChild(li)

})

}

function addTodo(){

let text=todoInput.value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

todoInput.value=""

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

</script>

</body>
</html>
