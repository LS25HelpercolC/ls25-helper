<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LS25 Helper v1.41</title>

<style>

body{
font-family:Arial;
margin:0;
background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") center/cover fixed;
color:white;
}

.app{
display:flex;
height:100vh;
background:rgba(0,0,0,0.75);
}

.sidebar{
width:220px;
background:#1b1f24;
padding:15px;
}

.sidebar h2{
margin-top:0;
}

.navBtn{
display:block;
width:100%;
margin:6px 0;
padding:10px;
border:none;
border-radius:6px;
background:#4caf50;
color:white;
cursor:pointer;
text-align:left;
}

.navBtn:hover{
background:#66bb6a;
}

.content{
flex:1;
padding:20px;
overflow:auto;
}

.section{
display:none;
background:#2b2f36;
padding:20px;
border-radius:10px;
max-width:900px;
}

.active{
display:block;
}

input,select{
padding:8px;
margin:5px;
border:none;
border-radius:6px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:10px;
font-size:18px;
}

.checkbox{
display:block;
margin:4px 0;
}

.fieldCard{
background:#3a4048;
padding:10px;
margin:6px 0;
border-radius:8px;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>LS25 Helper</h2>

<button class="navBtn" onclick="openSection('profit')">Profit Rechner</button>
<button class="navBtn" onclick="openSection('best')">Beste Frucht</button>
<button class="navBtn" onclick="openSection('work')">Arbeitszeit</button>
<button class="navBtn" onclick="openSection('bales')">Ballen Rechner</button>
<button class="navBtn" onclick="openSection('animals')">Tier Futter</button>
<button class="navBtn" onclick="openSection('planner')">Feldplanung</button>
<button class="navBtn" onclick="openSection('farm')">Farm Planung</button>
<button class="navBtn" onclick="openSection('todo')">Farm To-Do</button>

</div>

<div class="content">

<!-- PROFIT -->

<div id="profit" class="section active">

<h2>Profit Rechner</h2>

<select id="cropSelect" onchange="setYield()">
<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais</option>
<option value="5000">🫘 Sojabohnen</option>
</select>

<input id="yieldha" readonly>

<input id="fieldsize" placeholder="Feldgröße (ha)">
<input id="price" placeholder="Preis pro 1000L">

<h3>Düngung</h3>

<select id="fert">
<option value="1">Keine</option>
<option value="1.25">1x Dünger</option>
<option value="1.5">2x Dünger</option>
</select>

<h3>Additive</h3>

<label class="checkbox">
<input type="checkbox" id="mulch"> Mulchen (+2.5%)
</label>

<label class="checkbox">
<input type="checkbox" id="roll"> Walzen (+2.5%)
</label>

<label class="checkbox">
<input type="checkbox" id="stones"> Steine entfernt (+2%)
</label>

<button onclick="calculateProfit()">Berechnen</button>

<div class="result" id="profitResult"></div>

</div>

<!-- BEST -->

<div id="best" class="section">

<h2>Beste Frucht Rechner</h2>

<input id="bestFieldSize" placeholder="Feldgröße (ha)">

<button onclick="bestCrop()">Berechnen</button>

<div class="result" id="bestResult"></div>

</div>

<!-- WORKTIME -->

<div id="work" class="section">

<h2>Arbeitszeit Rechner</h2>

<input id="width" placeholder="Arbeitsbreite (m)">
<input id="speed" placeholder="Geschwindigkeit (km/h)">
<input id="workField" placeholder="Feldgröße (ha)">

<button onclick="calcWork()">Berechnen</button>

<div class="result" id="workResult"></div>

</div>

<!-- BALES -->

<div id="bales" class="section">

<h2>Ballen Rechner</h2>

<input id="baleSize" placeholder="Ballengröße">
<input id="baleCount" placeholder="Anzahl">

<button onclick="calcBales()">Berechnen</button>

<div class="result" id="baleResult"></div>

</div>

<!-- ANIMALS -->

<div id="animals" class="section">

<h2>Tier Futter Rechner</h2>

<input id="animalsCount" placeholder="Tiere">
<input id="foodPerDay" placeholder="Futter pro Tier">

<button onclick="calcAnimals()">Berechnen</button>

<div class="result" id="animalResult"></div>

</div>

<!-- PLANNER -->

<div id="planner" class="section">

<h2>Feldplanung</h2>

<p>Hier kommt in späteren Versionen die vollständige Fruchtplanung.</p>

</div>

<!-- FARM -->

<div id="farm" class="section">

<h2>Farm Planung</h2>

<input id="fieldName" placeholder="Feldname">

<select id="fieldCrop">
<option>Weizen</option>
<option>Gerste</option>
<option>Raps</option>
<option>Mais</option>
<option>Sojabohnen</option>
</select>

<input id="fieldSizeInput" placeholder="Größe (ha)">

<button onclick="addField()">Speichern</button>

<div id="farmList"></div>

</div>

<!-- TODO -->

<div id="todo" class="section">

<h2>Farm To-Do</h2>

<input id="todoInput" placeholder="Neue Aufgabe">

<button onclick="addTodo()">Hinzufügen</button>

<ul id="todoList"></ul>

</div>

</div>
</div>

<script>

function openSection(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

/* PROFIT */

function setYield(){

let crop=document.getElementById("cropSelect").value
document.getElementById("yieldha").value=crop

}

setYield()

function calculateProfit(){

let size=parseFloat(document.getElementById("fieldsize").value)
let yieldha=parseFloat(document.getElementById("yieldha").value)
let price=parseFloat(document.getElementById("price").value)
let fert=parseFloat(document.getElementById("fert").value)

let bonus=1

if(document.getElementById("mulch").checked) bonus+=0.025
if(document.getElementById("roll").checked) bonus+=0.025
if(document.getElementById("stones").checked) bonus+=0.02

let yieldTotal=size*yieldha*fert*bonus
let profit=(yieldTotal/1000)*price

document.getElementById("profitResult").innerHTML=
"Ertrag: "+Math.round(yieldTotal)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

/* BEST */

function bestCrop(){

let size=parseFloat(document.getElementById("bestFieldSize").value)

let crops=[
{name:"Weizen",yield:8900,price:900},
{name:"Gerste",yield:9600,price:850},
{name:"Raps",yield:5800,price:1200},
{name:"Sojabohnen",yield:5000,price:1500}
]

let best=""
let bestProfit=0

crops.forEach(c=>{

let profit=(size*c.yield/1000)*c.price

if(profit>bestProfit){
bestProfit=profit
best=c.name
}

})

document.getElementById("bestResult").innerHTML=
"Beste Frucht: "+best+" Gewinn: "+Math.round(bestProfit)

}

/* WORKTIME */

function calcWork(){

let width=parseFloat(document.getElementById("width").value)
let speed=parseFloat(document.getElementById("speed").value)
let size=parseFloat(document.getElementById("workField").value)

let haHour=(width*speed)/10
let time=size/haHour

document.getElementById("workResult").innerHTML=
"Leistung: "+haHour.toFixed(2)+" ha/h<br>Zeit: "+time.toFixed(2)+" Stunden"

}

/* BALES */

function calcBales(){

let size=parseFloat(document.getElementById("baleSize").value)
let count=parseFloat(document.getElementById("baleCount").value)

document.getElementById("baleResult").innerHTML=
"Total: "+(size*count)

}

/* ANIMALS */

function calcAnimals(){

let animals=parseFloat(document.getElementById("animalsCount").value)
let food=parseFloat(document.getElementById("foodPerDay").value)

document.getElementById("animalResult").innerHTML=
"Gesamt Futter pro Tag: "+animals*food

}

/* TODO */

function loadTodos(){

let todos=JSON.parse(localStorage.getItem("todos"))||[]

let list=document.getElementById("todoList")
list.innerHTML=""

todos.forEach((t,i)=>{

let li=document.createElement("li")

li.innerHTML=
'<input type="checkbox" '+(t.done?'checked':'')+
' onchange="toggleTodo('+i+')"> '+t.text

list.appendChild(li)

})

}

function addTodo(){

let text=document.getElementById("todoInput").value

let todos=JSON.parse(localStorage.getItem("todos"))||[]

todos.push({text:text,done:false})

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

function toggleTodo(i){

let todos=JSON.parse(localStorage.getItem("todos"))

todos[i].done=!todos[i].done

localStorage.setItem("todos",JSON.stringify(todos))

loadTodos()

}

loadTodos()

/* FARM */

function addField(){

let name=document.getElementById("fieldName").value
let crop=document.getElementById("fieldCrop").value
let size=document.getElementById("fieldSizeInput").value

let fields=JSON.parse(localStorage.getItem("fields"))||[]

fields.push({name,crop,size})

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

function renderFields(){

let fields=JSON.parse(localStorage.getItem("fields"))||[]

let html=""

fields.forEach((f,i)=>{

html+=`
<div class="fieldCard">
<b>${f.name}</b><br>
Frucht: ${f.crop}<br>
Größe: ${f.size} ha
<button onclick="deleteField(${i})">Löschen</button>
</div>
`

})

document.getElementById("farmList").innerHTML=html

}

function deleteField(i){

let fields=JSON.parse(localStorage.getItem("fields"))

fields.splice(i,1)

localStorage.setItem("fields",JSON.stringify(fields))

renderFields()

}

renderFields()

</script>

</body>
</html>
