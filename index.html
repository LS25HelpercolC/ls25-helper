<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper</title>

<style>

body{
margin:0;
font-family:Arial;
background:url('farm.jpg') center/cover no-repeat fixed;
color:white;
}

.app{
display:flex;
height:100vh;
backdrop-filter:blur(6px);
}

.sidebar{
width:220px;
background:#1e2a33;
padding:20px;
}

.sidebar h2{
margin-top:0;
}

.sidebar button{
width:100%;
margin:6px 0;
padding:10px;
background:#2e3d47;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
text-align:left;
}

.content{
flex:1;
}

iframe{
width:100%;
height:100%;
border:none;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>🚜 LS25 Helper</h2>

<button onclick="openPage('profit/index.html','profit.jpg')">
Profit Rechner
</button>

<button onclick="openPage('feldplanung/index.html','fields.jpg')">
Feldplanung
</button>

<button onclick="openPage('arbeitszeit/index.html','work.png')">
Arbeitszeit
</button>

<button onclick="openPage('tierfutter/index.html','animals.jpg')">
Tierfutter
</button>

<button onclick="openPage('todo/index.html','farm.jpg')">
Farm To-Do
</button>

</div>

<div class="content">

<iframe id="frame" src="profit/index.html"></iframe>

</div>

</div>

<script>

function openPage(page,bg){

document.getElementById("frame").src = page
document.body.style.backgroundImage = "url('"+bg+"')"

}

</script>

</body>
</html>
