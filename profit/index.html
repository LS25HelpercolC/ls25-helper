<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<style>

body{
font-family:Arial;
color:white;
}

.row{
display:flex;
gap:10px;
}

select,input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:none;
}

.calc{
width:100%;
padding:12px;
background:#4CAF50;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.result{
text-align:center;
margin-top:15px;
font-size:18px;
}

.workGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.workBtn{
padding:10px;
background:#3a3a3a;
border-radius:6px;
cursor:pointer;
text-align:center;
}

.workBtn.active{
background:#4CAF50;
}

.fertBtn{
padding:10px;
background:#3a3a3a;
border-radius:6px;
cursor:pointer;
text-align:center;
}

.fertBtn.active{
background:#4CAF50;
}

</style>
</head>

<body>

<h1>🚜 Profit Rechner</h1>

<select id="crop">
<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais (Korn)</option>
<option value="45000">🌽 Silomais</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🟥 Zuckerrüben</option>
<option value="6500">🫛 Erbsen</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="7000">🌿 Reis</option>
<option value="8500">🌿 Sorghum</option>
<option value="15000">🌲 Pappel</option>
<option value="4000">🌱 Ölrettich</option>
<option value="20000">🌿 Gras</option>
</select>

<div class="row">

<input id="size" type="number" placeholder="Feldgröße (ha)">
<input id="price" type="number" placeholder="Preis pro 1000L">

</div>

<h3>Düngestufe</h3>

<div class="workGrid">

<div class="fertBtn active" data-value="1" onclick="selectFert(this)">Keine</div>
<div class="fertBtn" data-value="1.25" onclick="selectFert(this)">1x Düngen</div>
<div class="fertBtn" data-value="1.5" onclick="selectFert(this)">2x Düngen</div>

</div>

<h3>Arbeitsschritte</h3>

<div class="workGrid">

<div class="workBtn" id="mulch" onclick="toggleWork(this)">Mulchen</div>
<div class="workBtn" id="roll" onclick="toggleWork(this)">Walzen</div>
<div class="workBtn" id="lime" onclick="toggleWork(this)">Kalk</div>
<div class="workBtn" id="weed" onclick="toggleWork(this)">Unkraut entfernt</div>
<div class="workBtn" id="pf" onclick="toggleWork(this)">Precision Farming</div>

</div>

<button class="calc" onclick="calc()">Berechnen</button>

<div class="result" id="result"></div>

<script>

function toggleWork(el){
el.classList.toggle("active")
}

function selectFert(el){

document.querySelectorAll(".fertBtn").forEach(btn=>btn.classList.remove("active"))
el.classList.add("active")

}

function calc(){

let yieldHa=document.getElementById("crop").value
let size=document.getElementById("size").value
let price=document.getElementById("price").value

let fert=document.querySelector(".fertBtn.active").dataset.value

let bonus=1

if(document.getElementById("mulch").classList.contains("active")) bonus+=0.025
if(document.getElementById("roll").classList.contains("active")) bonus+=0.025
if(document.getElementById("lime").classList.contains("active")) bonus+=0.15
if(document.getElementById("weed").classList.contains("active")) bonus+=0.10
if(document.getElementById("pf").classList.contains("active")) bonus+=0.05

let totalYield=yieldHa*size*fert*bonus
let profit=(totalYield/1000)*price

document.getElementById("result").innerHTML=
"Ertrag: "+Math.round(totalYield)+" L<br>Gewinn: "+Math.round(profit)+" €"

}

</script>

</body>
</html>
