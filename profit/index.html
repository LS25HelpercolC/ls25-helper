<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="../assets/css/style.css">

<style>
body{
font-family:Arial;
color:white;
margin:20px;
}
</style>

</head>

<body>

<h1>🚜 Profit Rechner</h1>

<select id="crop">

<option value="8900">🌾 Weizen</option>
<option value="9600">🌾 Gerste</option>
<option value="8800">🌾 Hafer</option>
<option value="5800">🌱 Raps</option>
<option value="9200">🌽 Mais (Korn)</option>
<option value="45000">🌽 Silomais</option>
<option value="5000">🫘 Sojabohnen</option>
<option value="7000">🌻 Sonnenblumen</option>
<option value="42000">🥔 Kartoffeln</option>
<option value="60000">🟥 Zuckerrüben</option>
<option value="6500">🫛 Erbsen</option>
<option value="30000">🥕 Karotten</option>
<option value="28000">🥔 Pastinaken</option>
<option value="12000">🍇 Trauben</option>
<option value="10000">🫒 Oliven</option>
<option value="7000">🌿 Reis</option>
<option value="8500">🌿 Sorghum</option>
<option value="15000">🌲 Pappel</option>
<option value="4000">🌱 Ölrettich</option>
<option value="20000">🌿 Gras</option>

</select>

<div class="row">

<input id="size" type="number" placeholder="Feldgröße (ha)">
<input id="price" type="number" placeholder="Preis pro 1000L">

</div>


<h3>Düngestufe</h3>

<div class="workGrid">

<div class="fertBtn active" data-value="1" onclick="selectFert(this)">
Keine
</div>

<div class="fertBtn" data-value="1.25" onclick="selectFert(this)">
1x Düngen (+25%)
</div>

<div class="fertBtn" data-value="1.5" onclick="selectFert(this)">
2x Düngen (+50%)
</div>

</div>


<h3>Arbeitsschritte</h3>

<div class="workGrid">

<div class="workBtn" id="mulch" onclick="toggleWork(this)">
Mulchen (+2.5%)
</div>

<div class="workBtn" id="roll" onclick="toggleWork(this)">
Walzen (+2.5%)
</div>

<div class="workBtn" id="lime" onclick="toggleWork(this)">
Kalk (+15%)
</div>

<div class="workBtn" id="weed" onclick="toggleWork(this)">
Unkraut entfernt (+10%)
</div>

<div class="workBtn" id="pf" onclick="toggleWork(this)">
Precision Farming (+5%)
</div>

</div>


<button class="calc" onclick="calc()">Berechnen</button>

<div class="result" id="result"></div>


<script src="../assets/js/app.js"></script>

</body>
</html>
