<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<title>LS25 Helper – Feldplanung</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

.cropSelect{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.cropCard{
width:90px;
text-align:center;
cursor:pointer;
padding:6px;
border-radius:6px;
background:rgba(0,0,0,0.4);
}

.cropCard.active{
background:#2e7d32;
}

.cropCard img{
width:48px;
height:48px;
display:block;
margin:auto;
}

.monthRow{
display:grid;
grid-template-columns:repeat(12,1fr);
margin-bottom:6px;
}

.monthCell{
text-align:center;
padding:4px;
cursor:pointer;
border-radius:4px;
}

.monthAllowed{
background:#2e7d32;
}

.timelineBar{
height:24px;
margin-top:6px;
background:linear-gradient(90deg,#2ecc71,#f1c40f,#e67e22);
border-radius:6px;
}

.yearBlock{
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="layout">

<div class="panel">

<h1>Feldplanung</h1>

<div id="cropSelect" class="cropSelect"></div>

<div id="months"></div>

<div id="timeline"></div>

</div>

<div class="calendar">

<h3>Pflanzenkalender</h3>

<div class="calendarHeader">
<span>Pflanze</span>
<span>Aussaat</span>
<span>Ernte</span>
</div>

<div id="calendar"></div>

</div>

</div>

<script>

const months=[
"Jan","Feb","Mär","Apr","Mai","Jun",
"Jul","Aug","Sep","Okt","Nov","Dez"
]

let cropsData={}
let selectedCrop=null
let timeline=[]

async function init(){

 const res=await fetch("../assets/data/crops.json")
 cropsData=await res.json()

 cropsData["Ölrettich"]={
  sow:["Aug","Sep"],
  harvest:["Okt","Nov"]
 }

 cropsData["Brach"]={
  sow:["Jan"],
  harvest:["Dez"]
 }

 buildCropSelect()
 buildCalendar()
 buildMonthBar()

}

function buildCropSelect(){

 const box=document.getElementById("cropSelect")
 box.innerHTML=""

 Object.keys(cropsData).forEach(crop=>{

  const card=document.createElement("div")
  card.className="cropCard"

  card.innerHTML=
  "<img src='../assets/images/crops/placeholder.png'>"+
  "<div>"+crop+"</div>"

  card.onclick=()=>{
   selectedCrop=crop
   document.querySelectorAll(".cropCard").forEach(c=>c.classList.remove("active"))
   card.classList.add("active")
   highlightMonths()
  }

  box.appendChild(card)

 })

}

function buildMonthBar(){

 const container=document.getElementById("months")
 container.innerHTML=""

 const row=document.createElement("div")
 row.className="monthRow"

 months.forEach((m,i)=>{

  const cell=document.createElement("div")
  cell.className="monthCell"
  cell.innerText=m

  cell.onclick=()=>monthClick(i)

  row.appendChild(cell)

 })

 container.appendChild(row)

}

function highlightMonths(){

 if(!selectedCrop)return

 const cells=document.querySelectorAll(".monthCell")

 cells.forEach((c,i)=>{

  c.classList.remove("monthAllowed")

  if(cropsData[selectedCrop].sow.includes(months[i])){
   c.classList.add("monthAllowed")
  }

 })

}

function monthClick(monthIndex){

 if(!selectedCrop)return

 if(!cropsData[selectedCrop].sow.includes(months[monthIndex]))return

 const sowIndex=months.indexOf(cropsData[selectedCrop].sow[0])
 const harvestIndex=months.indexOf(cropsData[selectedCrop].harvest[0])

 let growth=harvestIndex-sowIndex
 if(growth<0)growth+=12

 timeline.push({
  crop:selectedCrop,
  sow:monthIndex,
  harvest:monthIndex+growth
 })

 drawTimeline()

}

function drawTimeline(){

 const box=document.getElementById("timeline")
 box.innerHTML=""

 const years=5

 for(let y=0;y<years;y++){

  const block=document.createElement("div")
  block.className="yearBlock"

  const label=document.createElement("div")
  label.innerText="Jahr "+(y+1)

  block.appendChild(label)

  const monthsRow=document.createElement("div")
  monthsRow.className="monthRow"

  months.forEach(m=>{
   const cell=document.createElement("div")
   cell.className="monthCell"
   cell.innerText=m
   monthsRow.appendChild(cell)
  })

  block.appendChild(monthsRow)

  const bar=document.createElement("div")
  bar.className="timelineBar"

  block.appendChild(bar)

  box.appendChild(block)

 }

}

function buildCalendar(){

 const box=document.getElementById("calendar")
 box.innerHTML=""

 Object.keys(cropsData).forEach(crop=>{

  const row=document.createElement("div")
  row.className="calendarItem"

  row.innerHTML=
  "<span>"+crop+"</span>"+
  "<span>"+cropsData[crop].sow.join("-")+"</span>"+
  "<span>"+cropsData[crop].harvest.join("-")+"</span>"

  box.appendChild(row)

 })

}

window.onload=init

</script>

</body>
</html>
