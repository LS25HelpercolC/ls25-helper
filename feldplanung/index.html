<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper – Feldplanung</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

.layout{
display:flex;
gap:20px;
}

.crop-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:25px;
}

.crop{
background:#1e2b33;
padding:12px;
border-radius:8px;
text-align:center;
cursor:pointer;
}

.crop img{
width:60px;
height:60px;
display:block;
margin:auto;
margin-bottom:6px;
}

.crop.active{
background:#2e7d32;
}

.month-bar{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:6px;
margin-top:15px;
margin-bottom:20px;
}

.month{
padding:6px;
background:#23323b;
text-align:center;
border-radius:4px;
cursor:pointer;
}

.month.allowed{
background:#2ecc71;
color:black;
font-weight:bold;
}

.timeline-row{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:4px;
margin-bottom:6px;
}

.cell{
height:26px;
border-radius:4px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

.sow{
background:#2ecc71;
}

.grow{
background:#f1c40f;
}

.harvest{
background:#e67e22;
}

.cell img{
height:16px;
}

</style>
</head>

<body>

<div class="layout">

<div class="panel">

<h1>Feldplanung</h1>

<div id="cropGrid" class="crop-grid"></div>

<div id="monthBar" class="month-bar"></div>

<div id="timeline"></div>

</div>

<div class="calendar" id="calendar">

<h3>Pflanzenkalender</h3>

<div class="calendarHeader">
<span>Frucht</span>
<span>Aussaat</span>
<span>Ernte</span>
</div>

</div>

</div>

<script>

const months=[
"Jan","Feb","Mär","Apr","Mai","Jun",
"Jul","Aug","Sep","Okt","Nov","Dez"
]

const YEARS=5

let crops={}
let selectedCrop=null
let timeline=[]

const cropIcons={
"Weizen":"wheat.png",
"Gerste":"barley.png",
"Hafer":"oats.png",
"Raps":"rapeseed.png",
"Mais (Korn)":"corn.png",
"Mais (Silomais)":"corn.png",
"Sojabohnen":"soybean.png",
"Sonnenblumen":"sunflower.png",
"Kartoffeln":"potato.png",
"Zuckerrüben":"sugarbeet.png",
"Erbsen":"pea.png",
"Karotten":"carrot.png",
"Pastinaken":"carrot.png",
"Reis":"rice.png",
"Sorghum":"sorghum.png",
"Trauben":"grape.png",
"Oliven":"olive.png",
"Pappel":"poplar.png",
"Ölrettich":"oilradish.png",
"Gras":"grass.png",
"Brach":"fallow.png"
}

async function init(){

 const res=await fetch("../assets/data/crops.json")
 crops=await res.json()

 buildCalendar()
 buildCrops()
 buildMonths()

}

function buildCalendar(){

 const cal=document.getElementById("calendar")

 Object.keys(crops).forEach(name=>{

  const sow=crops[name].sow.join("–")
  const harvest=crops[name].harvest.join("–")

  const item=document.createElement("div")
  item.className="calendarItem"

  item.innerHTML=
  `<span>${name}</span>
   <span>${sow}</span>
   <span>${harvest}</span>`

  cal.appendChild(item)

 })

}

function buildCrops(){

 const grid=document.getElementById("cropGrid")

 Object.keys(crops).forEach(crop=>{

  const icon=cropIcons[crop] || "wheat.png"

  const el=document.createElement("div")
  el.className="crop"

  el.innerHTML=
  `<img src="../assets/images/crops/${icon}">
   <div>${crop}</div>`

  el.onclick=()=>selectCrop(crop,el)

  grid.appendChild(el)

 })

}

function selectCrop(crop,el){

 selectedCrop=crop

 document.querySelectorAll(".crop").forEach(c=>{
  c.classList.remove("active")
 })

 el.classList.add("active")

 highlightMonths()

}

function buildMonths(){

 const bar=document.getElementById("monthBar")

 months.forEach((m,i)=>{

  const el=document.createElement("div")
  el.className="month"
  el.innerText=m

  el.onclick=()=>monthClick(i)

  bar.appendChild(el)

 })

}

function highlightMonths(){

 document.querySelectorAll(".month").forEach((m,i)=>{

  m.classList.remove("allowed")

  if(crops[selectedCrop].sow.includes(months[i])){
   m.classList.add("allowed")
  }

 })

}

function monthClick(index){

 if(!selectedCrop)return
 if(!crops[selectedCrop].sow.includes(months[index]))return

 const sowList=crops[selectedCrop].sow
 const harvestList=crops[selectedCrop].harvest

 const sowIndex=sowList.indexOf(months[index])
 const harvestMonth=harvestList[sowIndex]

 const end=months.indexOf(harvestMonth)

 timeline.push({
  crop:selectedCrop,
  start:index,
  end:end
 })

 drawTimeline()

}

function drawTimeline(){

 const box=document.getElementById("timeline")
 box.innerHTML=""

 timeline.forEach(t=>{

  const icon=cropIcons[t.crop]

  for(let y=0;y<YEARS;y++){

   const row=document.createElement("div")
   row.className="timeline-row"

   for(let i=0;i<12;i++){

    const cell=document.createElement("div")
    cell.className="cell"

    if(i===t.start && y===0){
     cell.classList.add("sow")
     cell.innerHTML=`<img src="../assets/images/crops/${icon}">`
    }

    else if(i===t.end && (t.end>t.start?y===0:y===1)){
     cell.classList.add("harvest")
     cell.innerHTML=`<img src="../assets/images/crops/${icon}">`
    }

    else if(
     (t.start<t.end && y===0 && i>t.start && i<t.end) ||
     (t.start>t.end && (
       (y===0 && i>t.start) ||
       (y===1 && i<t.end)
     ))
    ){
     cell.classList.add("grow")
    }

    row.appendChild(cell)

   }

   box.appendChild(row)

  }

 })

}

window.onload=init

</script>

</body>
</html>
