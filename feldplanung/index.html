<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<title>LS25 Helper – Feldplanung</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

.timelineMonths{
display:grid;
grid-template-columns:repeat(12,1fr);
margin-bottom:10px;
}

.month{
background:#2e3d47;
padding:6px;
text-align:center;
cursor:pointer;
border-radius:4px;
}

.month:hover{
background:#4CAF50;
}

.yearRow{
margin-bottom:12px;
font-family:monospace;
}

.yearLabel{
margin-bottom:4px;
font-weight:bold;
}

.monthRow{
display:grid;
grid-template-columns:repeat(12,1fr);
}

.monthCell{
text-align:center;
}

.cropBox{
background:#4CAF50;
color:white;
border-radius:4px;
padding:2px;
}

.rotationBox{
margin-bottom:15px;
}

.rotationItem{
display:inline-block;
background:#444;
padding:6px 10px;
margin-right:5px;
border-radius:4px;
}

</style>

</head>

<body>

<div class="layout">

<div class="panel">

<h1>Feldplanung</h1>

<div class="rotationBox">
<b>Fruchtfolge:</b>
<div id="rotationList"></div>
<button onclick="addRotation()">+ Frucht</button>
</div>

<div id="timeline"></div>

</div>

<div class="calendar">

<h3>Pflanzenkalender</h3>

<div class="calendarHeader">
<span>Pflanze</span>
<span>Aussaat</span>
<span>Ernte</span>
</div>

<div id="calendar"></div>

</div>

</div>

<script>

const months=[
"Jan","Feb","Mär","Apr","Mai","Jun",
"Jul","Aug","Sep","Okt","Nov","Dez"
]

let cropsData={}
let rotation=[]

async function init(){

 const res=await fetch("../assets/data/crops.json")
 cropsData=await res.json()

 // Sonderfälle hinzufügen
 cropsData["Ölrettich"]={
  sow:["Aug","Sep"],
  harvest:["Okt","Nov"]
 }

 cropsData["Brach"]={
  sow:["Jan"],
  harvest:["Dez"]
 }

 buildCalendar()

}

function buildCalendar(){

 const box=document.getElementById("calendar")
 box.innerHTML=""

 Object.keys(cropsData).forEach(crop=>{

  const row=document.createElement("div")
  row.className="calendarItem"

  row.innerHTML=
  "<span>"+crop+"</span>"+
  "<span>"+cropsData[crop].sow.join("-")+"</span>"+
  "<span>"+cropsData[crop].harvest.join("-")+"</span>"

  box.appendChild(row)

 })

}

function addRotation(){

 const crop=prompt("Frucht eingeben")

 if(!cropsData[crop]){
  alert("Frucht nicht gefunden")
  return
 }

 rotation.push(crop)

 drawRotation()
 drawTimeline()

}

function drawRotation(){

 const box=document.getElementById("rotationList")
 box.innerHTML=""

 rotation.forEach(c=>{

  const el=document.createElement("div")
  el.className="rotationItem"
  el.innerText=c

  box.appendChild(el)

 })

}

function getGrowth(crop){

 const sowIndex=months.indexOf(cropsData[crop].sow[0])
 const harvestIndex=months.indexOf(cropsData[crop].harvest[0])

 let growth=harvestIndex-sowIndex
 if(growth<0)growth+=12

 return growth

}

function generateTimeline(years=5){

 let segments=[]

 let currentMonth=8
 let rotIndex=0

 for(let y=0;y<years*12;){

  const crop=rotation[rotIndex]

  const growth=getGrowth(crop)

  segments.push({
   crop:crop,
   sow:currentMonth,
   harvest:(currentMonth+growth)
  })

  currentMonth=(currentMonth+growth)%12

  y+=growth

  rotIndex++
  if(rotIndex>=rotation.length)rotIndex=0

 }

 return segments

}

function drawTimeline(){

 const container=document.getElementById("timeline")
 container.innerHTML=""

 if(rotation.length===0)return

 const years=5

 const timeline=generateTimeline(years)

 for(let y=0;y<years;y++){

  const row=document.createElement("div")
  row.className="yearRow"

  const label=document.createElement("div")
  label.className="yearLabel"
  label.innerText="Jahr "+(y+1)

  row.appendChild(label)

  const monthsRow=document.createElement("div")
  monthsRow.className="monthRow"

  for(let m=0;m<12;m++){

   const cell=document.createElement("div")
   cell.className="monthCell"

   monthsRow.appendChild(cell)

  }

  row.appendChild(monthsRow)

  container.appendChild(row)

 }

}

window.onload=init

</script>

</body>
</html>
