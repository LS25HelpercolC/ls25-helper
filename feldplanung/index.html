<script>

const months=[
"Jan","Feb","Mär","Apr","Mai","Jun",
"Jul","Aug","Sep","Okt","Nov","Dez"
]

let crops={}
let selectedCrop=null
let timeline=[]

const cropIcons={
"Weizen":"wheat.png",
"Gerste":"barley.png",
"Hafer":"oats.png",
"Raps":"rapeseed.png",
"Mais (Korn)":"corn.png",
"Mais (Silomais)":"corn.png",
"Sojabohnen":"soybean.png",
"Sonnenblumen":"sunflower.png",
"Kartoffeln":"potato.png",
"Zuckerrüben":"sugarbeet.png",
"Erbsen":"pea.png",
"Karotten":"carrot.png",
"Pastinaken":"carrot.png",
"Reis":"rice.png",
"Sorghum":"sorghum.png",
"Trauben":"grape.png",
"Oliven":"olive.png",
"Pappel":"poplar.png",
"Ölrettich":"oilradish.png",
"Gras":"grass.png",
"Brach":"fallow.png"
}

async function init(){

 const res=await fetch("../assets/data/crops.json")
 crops=await res.json()

 buildCalendar()
 buildCrops()
 buildMonths()

}

function buildCalendar(){

 const cal=document.getElementById("calendar")

 Object.keys(crops).forEach(name=>{

  const sow=crops[name].sow.join("–")
  const harvest=crops[name].harvest.join("–")

  const item=document.createElement("div")
  item.className="calendarItem"

  item.innerHTML=`
  <span>${name}</span>
  <span>${sow}</span>
  <span>${harvest}</span>
  `

  cal.appendChild(item)

 })

}

function buildCrops(){

 const grid=document.getElementById("cropGrid")
 grid.innerHTML=""

 Object.keys(crops).forEach(crop=>{

  const icon=cropIcons[crop] || "wheat.png"

  const el=document.createElement("div")
  el.className="crop"

  el.innerHTML=
  `<img src="../assets/images/crops/${icon}">
   <div>${crop}</div>`

  el.onclick=()=>selectCrop(crop,el)

  grid.appendChild(el)

 })

}

function selectCrop(crop,el){

 selectedCrop=crop

 document.querySelectorAll(".crop").forEach(c=>{
  c.classList.remove("active")
 })

 el.classList.add("active")

 highlightMonths()

}

function buildMonths(){

 const bar=document.getElementById("monthBar")

 months.forEach((m,i)=>{

  const el=document.createElement("div")
  el.className="month"
  el.innerText=m

  el.onclick=()=>monthClick(i)

  bar.appendChild(el)

 })

}

function highlightMonths(){

 document.querySelectorAll(".month").forEach((m,i)=>{

  m.classList.remove("allowed")

  if(crops[selectedCrop].sow.includes(months[i])){
   m.classList.add("allowed")
  }

 })

}

function monthClick(index){

 if(!selectedCrop)return
 if(!crops[selectedCrop].sow.includes(months[index]))return

 timeline.push({
  crop:selectedCrop,
  start:index
 })

 drawTimeline()

}

function drawTimeline(){

 const box=document.getElementById("timeline")
 box.innerHTML=""

 timeline.forEach((t,i)=>{

  const icon=cropIcons[t.crop] || "wheat.png"

  const row=document.createElement("div")
  row.className="year"

  row.innerHTML=
  `<div>Plan ${i+1}</div>
   <div class="timeline-bar">
   <img src="../assets/images/crops/${icon}" style="height:18px;margin-right:6px;vertical-align:middle;">
   ${t.crop}
   </div>`

  box.appendChild(row)

 })

}

window.onload=init

</script>
