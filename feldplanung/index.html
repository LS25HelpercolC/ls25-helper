<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS25 Helper – Feldplanung</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

.layout{
display:flex;
gap:20px;
}

.crop-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:25px;
}

.crop{
background:#1e2b33;
padding:12px;
border-radius:8px;
text-align:center;
cursor:pointer;
}

.crop img{
width:60px;
height:60px;
display:block;
margin:auto;
margin-bottom:6px;
}

.crop.active{
background:#2e7d32;
}

.month-bar{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:6px;
margin-top:15px;
margin-bottom:20px;
}

.month{
padding:6px;
background:#23323b;
text-align:center;
border-radius:4px;
cursor:pointer;
}

.month.allowed{
background:#2ecc71;
color:black;
font-weight:bold;
}

#timeline{
margin-top:30px;
}

.year{
margin-bottom:25px;
}

.timeline-bar{
height:28px;
background:linear-gradient(90deg,#2ecc71,#f1c40f,#e67e22);
border-radius:6px;
margin-top:8px;
display:flex;
align-items:center;
padding-left:10px;
font-weight:bold;
}

.timeline-bar img{
height:18px;
margin-right:6px;
}

</style>
</head>

<body>

<div class="layout">

<div class="panel">

<h1>Feldplanung</h1>

<div id="cropGrid" class="crop-grid"></div>

<div id="monthBar" class="month-bar"></div>

<div id="timeline"></div>

</div>

<div class="calendar" id="calendar">

<h3>Pflanzenkalender</h3>

<div class="calendarHeader">
<span>Frucht</span>
<span>Aussaat</span>
<span>Ernte</span>
</div>

</div>

</div>

<script>

const months=[
"Jan","Feb","Mär","Apr","Mai","Jun",
"Jul","Aug","Sep","Okt","Nov","Dez"
]

let crops={}
let selectedCrop=null
let timeline=[]

const cropIcons={
"Weizen":"wheat.png",
"Gerste":"barley.png",
"Hafer":"oats.png",
"Raps":"rapeseed.png",
"Mais (Korn)":"corn.png",
"Mais (Silomais)":"corn.png",
"Sojabohnen":"soybean.png",
"Sonnenblumen":"sunflower.png",
"Kartoffeln":"potato.png",
"Zuckerrüben":"sugarbeet.png",
"Erbsen":"pea.png",
"Karotten":"carrot.png",
"Pastinaken":"carrot.png",
"Reis":"rice.png",
"Sorghum":"sorghum.png",
"Trauben":"grape.png",
"Oliven":"olive.png",
"Pappel":"poplar.png",
"Ölrettich":"oilradish.png",
"Gras":"grass.png",
"Brach":"fallow.png"
}

async function init(){

 try{

 const res=await fetch("../assets/data/crops.json")
 crops=await res.json()

 buildCalendar()
 buildCrops()
 buildMonths()

 }catch(e){

 console.error("Fehler beim Laden:",e)

 }

}

function buildCalendar(){

 const cal=document.getElementById("calendar")
 if(!cal) return

 Object.keys(crops).forEach(name=>{

  const sow=crops[name].sow.join("–")
  const harvest=crops[name].harvest.join("–")

  const item=document.createElement("div")
  item.className="calendarItem"

  item.innerHTML=
  `<span>${name}</span>
   <span>${sow}</span>
   <span>${harvest}</span>`

  cal.appendChild(item)

 })

}

function buildCrops(){

 const grid=document.getElementById("cropGrid")
 if(!grid) return

 grid.innerHTML=""

 Object.keys(crops).forEach(crop=>{

  const icon=cropIcons[crop] || "wheat.png"

  const el=document.createElement("div")
  el.className="crop"

  el.innerHTML=
  `<img src="../assets/images/crops/${icon}">
   <div>${crop}</div>`

  el.onclick=()=>selectCrop(crop,el)

  grid.appendChild(el)

 })

}

function selectCrop(crop,el){

 selectedCrop=crop

 document.querySelectorAll(".crop").forEach(c=>{
  c.classList.remove("active")
 })

 el.classList.add("active")

 highlightMonths()

}

function buildMonths(){

 const bar=document.getElementById("monthBar")
 if(!bar) return

 months.forEach((m,i)=>{

  const el=document.createElement("div")
  el.className="month"
  el.innerText=m

  el.onclick=()=>monthClick(i)

  bar.appendChild(el)

 })

}

function highlightMonths(){

 if(!selectedCrop) return

 document.querySelectorAll(".month").forEach((m,i)=>{

  m.classList.remove("allowed")

  if(crops[selectedCrop].sow.includes(months[i])){
   m.classList.add("allowed")
  }

 })

}

function monthClick(index){

 if(!selectedCrop) return
 if(!crops[selectedCrop].sow.includes(months[index])) return

 timeline.push({
  crop:selectedCrop,
  start:index
 })

 drawTimeline()

}

function drawTimeline(){

 const box=document.getElementById("timeline")
 if(!box) return

 box.innerHTML=""

 timeline.forEach((t,i)=>{

  const icon=cropIcons[t.crop] || "wheat.png"

  const row=document.createElement("div")
  row.className="year"

  row.innerHTML=
  `<div>Plan ${i+1}</div>
   <div class="timeline-bar">
   <img src="../assets/images/crops/${icon}">
   ${t.crop}
   </div>`

  box.appendChild(row)

 })

}

window.onload=init

</script>

</body>
</html>
